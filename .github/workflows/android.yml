# Build the Android app on every push that touches android/. The debug
# APK artifact is signed with the debug keystore, so it installs
# directly on any device (enable install-from-unknown-sources).
#
# google-services.json: if the GOOGLE_SERVICES_JSON secret is set
# (base64 of the real file from Firebase Console), the build uses it and
# push notifications work in the artifact. Otherwise the committed
# placeholder is used - the app builds and runs, but FCM registration
# will fail until installed users get a build with the real file.
#
# This is also the compile check for the Kotlin code: the repo's dev
# environment has no Android SDK, so a green run here is the proof the
# app builds.
name: Android build

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Provide google-services.json
        working-directory: android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
            echo "Using real google-services.json from repository secret"
          else
            cp google-services.json.example google-services.json
            echo "Using placeholder google-services.json (FCM inert in this artifact)"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sysmon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
