openapi: 3.0.3
info:
  title: Sysmon Web API
  description: |
    RESTful API for the Sysmon monitoring system. Provides access to configuration management,
    real-time monitoring data, administrative commands, and bulk operations.

    ## Rate Limiting
    Requests are limited per client IP: 10 per minute for `/api/auth/login`,
    300 per minute for everything else. `/api/auth/logout` is never limited -
    it needs a valid session, and refusing a logout helps nobody. Rate limit
    information is returned in response headers:
    - `X-RateLimit-Limit`: Maximum requests allowed in the time window
    - `X-RateLimit-Remaining`: Number of requests remaining in current window
    - `X-RateLimit-Reset`: Unix timestamp when the rate limit resets

    ## Authentication
    Session-based: log in via `POST /api/auth/login` to receive a session
    token, then present it either as `Authorization: Bearer <token>` or in
    the `sysmon_session` cookie (the browser UI uses the cookie). Sessions
    renew on use with a 30-day sliding expiry. Admin-only endpoints
    additionally require the session's user to hold the admin role.
  version: 1.0.0
  contact:
    name: Sysmon API Support
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.sysmon.example.com
    description: Production server

# Every endpoint requires a session unless it explicitly opts out
# (login does; it is how a session is obtained).
security:
  - SessionAuth: []
  - CookieAuth: []

tags:
  - name: Configuration
    description: Configuration file management
  - name: Monitoring
    description: Real-time monitoring data and status
  - name: Bulk Operations
    description: Batch operations on multiple hosts
  - name: Admin
    description: Administrative and debug commands
  - name: Backups
    description: Configuration backup management
  - name: XML
    description: Raw XML data access (legacy)

paths:
  /api/auth/login:
    post:
      tags: [Admin]
      summary: Log in
      description: |
        Exchanges credentials for a session token. Rate limited to 10
        requests per minute per IP. The token goes in either the
        Authorization Bearer header or the sysmon_session cookie on
        every later request; sessions renew on use with a 30-day
        sliding expiry.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  username: { type: string }
                  role: { type: string }
        '401':
          description: Bad credentials
        '429':
          description: Rate limited

  /api/auth/logout:
    post:
      tags: [Admin]
      summary: Log out
      description: Ends the presented session. Never rate limited.
      responses:
        '200':
          description: Session ended

  # Configuration endpoints
  /api/config:
    get:
      tags: [Configuration]
      summary: Get structured configuration
      description: Returns the current configuration in structured JSON format
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Configuration]
      summary: Update configuration
      description: Updates the configuration with structured data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/config/validate:
    post:
      tags: [Configuration]
      summary: Validate configuration
      description: Validates configuration without saving it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  error:
                    type: string

  /api/config/reload:
    post:
      tags: [Configuration]
      summary: Reload daemon configuration
      description: Sends SIGHUP to sysmond to reload configuration
      security:
        - SessionAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Reload triggered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: sysmon reloaded successfully
        '500':
          $ref: '#/components/responses/InternalError'

  /api/config/raw:
    get:
      tags: [Configuration]
      summary: Get raw configuration file
      description: Returns the configuration file as plain text
      responses:
        '200':
          description: Raw configuration file
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
                  version:
                    type: string

    put:
      tags: [Configuration]
      summary: Update raw configuration file
      description: Updates the configuration file with raw text content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                version:
                  type: string
                comment:
                  type: string
      responses:
        '200':
          description: Configuration saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string

  # Monitoring endpoints
  /api/monitoring/status:
    get:
      tags: [Monitoring]
      summary: Get overall monitoring status
      description: >
        Returns summary statistics and daemon status. With `since`, returns
        only what changed after that revision (delta polling); the delta
        cursor belongs to one site's stream, so changing `site` requires
        starting again without `since`.
      parameters:
        - name: site
          in: query
          description: >
            Narrow to one monitoring box. Omit for the whole fleet.
          schema:
            type: string
        - name: since
          in: query
          description: Revision to return changes after (delta mode).
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/monitoring/hosts:
    get:
      tags: [Monitoring]
      summary: Get all monitored hosts
      description: Returns status information for all monitored hosts
      responses:
        '200':
          description: Hosts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HostStatus'

  /api/monitoring/host/{hostname}:
    get:
      tags: [Monitoring]
      summary: Get single host status
      description: Returns detailed status for a specific host
      parameters:
        - name: hostname
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Host status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/monitoring/alerts:
    get:
      tags: [Monitoring]
      summary: Get active alerts
      description: Returns all hosts currently in alert state
      responses:
        '200':
          description: Alerts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HostStatus'

  /api/monitoring/traps:
    get:
      tags: [Monitoring]
      summary: Get SNMP traps
      description: >
        Returns received SNMP traps, newest first. Each trap carries the
        site that received it: private address ranges overlap between
        sites, so a trap's identity is site plus source address, never
        the address alone. Severity and source filtering is applied to
        the whole set before any page is cut.
      parameters:
        - name: site
          in: query
          description: Only traps received by this monitoring box.
          schema:
            type: string
        - name: severity
          in: query
          description: >
            Only traps of this decoded severity. Traps that could not be
            decoded are reachable as `unknown`.
          schema:
            type: string
            enum: [informational, warning, error, critical, unknown]
        - name: source
          in: query
          description: >
            Only traps from this source. Accepts `site/address` for one
            exact device, or a bare `address` meaning that address at any
            site - private ranges overlap, so the bare form can match
            several distinct devices. The UI sends the qualified form.
          schema:
            type: string
          examples:
            exactDevice:
              value: bend/10.20.1.14
            anySite:
              value: 10.20.1.14
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Traps retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SNMPTrap'

  /api/monitoring/object-detail/{object}:
    get:
      tags: [Monitoring]
      summary: Get one object's detail, without check credentials
      description: >
        Queue state, counters, thresholds, timings and description for a
        single object - what the host detail page renders. The fields are
        a positive allow-list, so the daemon's credential-bearing tags
        (SNMP community, check username and password, RADIUS shared
        secret, HTTP header value, URL, failure command) cannot appear,
        including any added to the daemon later. The raw document is
        available to admins at `/api/xml/object/{object}`.
      parameters:
        - name: object
          in: path
          required: true
          description: Object key, site-qualified as `site:object` on a fleet.
          schema:
            type: string
      responses:
        '200':
          description: Detail retrieved
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: The object's status document could not be read
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/monitoring/topology:
    get:
      tags: [Monitoring]
      summary: Get the dependency graph, without config secrets
      description: >
        The shape of the network for the dependency map: object names,
        addresses, check types, descriptions, groups and dependencies.
        Deliberately separate from `/api/config`, which is admin-only
        because a config carries the daemon authkey, SNMP communities,
        RADIUS secrets, check passwords and spawn command lines. This
        endpoint is available to any authenticated user and carries none
        of those; the fields are an allow-list, not a redaction. Read
        only - editing topology is still a config write.
      parameters:
        - name: site
          in: query
          description: Which box's topology. Omit for the local config.
          schema:
            type: string
      responses:
        '200':
          description: Topology retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        ip: { type: string }
                        type: { type: string }
                        notes: { type: string }
                        group: { type: string }
                        dependencies: { type: string }
                        paused: { type: boolean }
                  version: { type: string }
                  site: { type: string }
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/map/layout:
    get:
      tags: [Monitoring]
      summary: Get hand-placed dependency-map positions
      description: >
        Node positions for one box's map. Layouts are per site, because
        the map is: object names are only unique within a box, so two
        boxes that both contain a `core` would otherwise share (and
        overwrite) one set of coordinates.
      parameters:
        - name: site
          in: query
          description: Which box's layout. Omit for the local map.
          schema:
            type: string
      responses:
        '200':
          description: Layout retrieved (an empty object when unset)
          content:
            application/json:
              schema:
                type: object
    put:
      tags: [Monitoring]
      summary: Save hand-placed dependency-map positions
      description: >
        Admin only: a saved layout is what everyone who opens the map
        sees, so writing one is a mutation of shared state.
      parameters:
        - name: site
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  x: { type: number }
                  y: { type: number }
      responses:
        '200':
          description: Layout saved
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/monitoring/history:
    get:
      tags: [Monitoring]
      summary: Get recent status transitions
      description: >
        Host and alerter transitions, newest first. A `site` narrows to
        one box, applied before `limit` is counted so the page is that
        site's newest events rather than whatever of the fleet's newest
        happened to belong to it. `truncated` says the window holds more
        than this page shows.
      parameters:
        - name: site
          in: query
          schema:
            type: string
        - name: window
          in: query
          description: Time window; anything other than `30d` is the 48h default.
          schema:
            type: string
            enum: ['48h', '30d']
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: History retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                  count: { type: integer }
                  available: { type: boolean }
                  window: { type: string }
                  limit: { type: integer }
                  truncated: { type: boolean }
        '503':
          description: The history store could not be read
          $ref: '#/components/responses/ServiceUnavailable'

  /api/monitoring/stats:
    get:
      tags: [Monitoring]
      summary: Get statistics
      description: Returns monitoring statistics
      responses:
        '200':
          description: Statistics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'

  /api/monitoring/ack/{hostname}:
    post:
      tags: [Monitoring]
      summary: Acknowledge host alert
      description: Acknowledges an alert for a specific host
      security:
        - SessionAuth: []
        - CookieAuth: []
      parameters:
        - name: hostname
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Host acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  hostname:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/monitoring/update/{hostname}:
    post:
      tags: [Monitoring]
      summary: Update host status note
      description: Updates the status note for a host
      security:
        - SessionAuth: []
        - CookieAuth: []
      parameters:
        - name: hostname
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  example: Investigating connectivity issue
              required:
                - note
      responses:
        '200':
          description: Host updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  hostname:
                    type: string
                  note:
                    type: string

  /api/monitoring/trace/{hostname}:
    post:
      tags: [Monitoring]
      summary: Toggle trace for host
      description: Enables or disables debug tracing for a host
      security:
        - SessionAuth: []
        - CookieAuth: []
      parameters:
        - name: hostname
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  hostname:
                    type: string
                  tracing_enabled:
                    type: boolean
                  message:
                    type: string

  # Bulk operations
  /api/monitoring/bulk/ack:
    post:
      tags: [Bulk Operations]
      summary: Acknowledge multiple hosts
      description: Acknowledges alerts for multiple hosts in a single request
      security:
        - SessionAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostnames:
                  type: array
                  items:
                    type: string
                  example: ["web1", "web2", "db1"]
              required:
                - hostnames
      responses:
        '200':
          description: Bulk operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResponse'

  /api/monitoring/bulk/update:
    post:
      tags: [Bulk Operations]
      summary: Update multiple hosts
      description: Updates status note for multiple hosts with the same message
      security:
        - SessionAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostnames:
                  type: array
                  items:
                    type: string
                  example: ["web1", "web2", "web3"]
                note:
                  type: string
                  example: Maintenance window - planned outage
              required:
                - hostnames
                - note
      responses:
        '200':
          description: Bulk operation completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BulkOperationResponse'
                  - type: object
                    properties:
                      note:
                        type: string

  /api/monitoring/bulk/trace:
    post:
      tags: [Bulk Operations]
      summary: Toggle trace for multiple hosts
      description: Enables or disables tracing for multiple hosts
      security:
        - SessionAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hostnames:
                  type: array
                  items:
                    type: string
                  example: ["web1", "web2"]
                enable:
                  type: boolean
                  example: true
              required:
                - hostnames
                - enable
      responses:
        '200':
          description: Bulk operation completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BulkOperationResponse'
                  - type: object
                    properties:
                      enable:
                        type: boolean

  # Backups
  /api/backups:
    get:
      tags: [Backups]
      summary: List configuration backups
      description: Returns a list of available configuration backups
      responses:
        '200':
          description: Backup list retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Backup'

  /api/backups/{filename}/restore:
    post:
      tags: [Backups]
      summary: Restore configuration backup
      description: Restores configuration from a backup file
      security:
        - SessionAuth: []
        - CookieAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: config.2024-01-15.bak
      responses:
        '200':
          description: Backup restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  # Admin endpoints
  /api/admin/version:
    get:
      tags: [Admin]
      summary: Get daemon version
      description: >
        Returns a sysmond's version. Name the site on a fleet: without
        one the answer is whichever box reports a version first, which is
        a coin toss mid-upgrade - exactly when the question gets asked.
      security:
        - SessionAuth: []
        - CookieAuth: []
      parameters:
        - name: site
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Version retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string

  /api/admin/debug:
    post:
      tags: [Admin]
      summary: Toggle debug mode
      description: Toggles debug logging in the daemon
      security:
        - SessionAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Debug mode toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string

  /api/admin/snmpd:
    post:
      tags: [Admin]
      summary: Toggle SNMP debug
      description: Toggles SNMP debug logging
      security:
        - SessionAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: SNMP debug toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string

  /api/admin/expiredns:
    post:
      tags: [Admin]
      summary: Expire DNS cache
      description: Forces expiration of the DNS cache
      security:
        - SessionAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: DNS cache expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string

  /api/admin/printq:
    get:
      tags: [Admin]
      summary: Print check queue
      description: Returns the current check queue status
      security:
        - SessionAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Queue status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: string

  /api/admin/nfd:
    get:
      tags: [Admin]
      summary: Get next file descriptor info
      description: Returns next file descriptor allocation info (debugging)
      security:
        - SessionAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: FD info retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  info:
                    type: string

  /api/admin/killit:
    post:
      tags: [Admin]
      summary: Shutdown daemon
      description: Gracefully shuts down the sysmon daemon
      security:
        - SessionAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Shutdown initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                  message:
                    type: string

  /api/alerters:
    get:
      tags: [Monitoring]
      summary: List alerters
      description: Alert-only peers seen since this process started - connected or not. Never part of the fleet.
      responses:
        '200':
          description: Alerters listed
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerters:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        application: { type: string, description: What the peer says it is, from its handshake }
                        nickname: { type: string, description: The admin's label; alerts prefer it }
                        addr: { type: string }
                        connected: { type: boolean }
                        connected_at: { type: string, format: date-time }
                        last_seen: { type: string, format: date-time }
                        last_alert_at: { type: string, format: date-time }
                        last_alert: { type: string }
                        alerts: { type: integer }
                  count:
                    type: integer

  /api/alerters/nickname:
    put:
      tags: [Admin]
      summary: Set an alerter's nickname
      description: The name its alerts display in place of what the application calls itself. Empty clears it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                nickname: { type: string }
      responses:
        '200':
          description: Nickname stored

  /api/settings/agents:
    get:
      tags: [Admin]
      summary: List agent credentials
      description: Every minted credential - monitoring boxes and alerters - without the secrets (tokens are stored hashed).
      security:
        - SessionAuth: []
        - CookieAuth: []
      responses:
        '200':
          description: Credential list
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgentToken'
    post:
      tags: [Admin]
      summary: Mint an agent credential
      description: |
        Mints a token for a site. The credential's kind is part of the record
        from the first write - a sysmond credential gets a sysmon.conf block
        in the response, an alerter credential gets the ALERTER greeting line.
        The plaintext token appears in this response once and is never
        recoverable afterwards. Re-minting with replace=true disconnects
        whatever currently holds the old token.
      security:
        - SessionAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site]
              properties:
                site:
                  type: string
                  description: Letters, digits, - and _ only; max 64
                label:
                  type: string
                  description: Human label; for alerters, also the display nickname
                kind:
                  type: string
                  enum: [sysmond, alerter]
                  description: Credential type; defaults to sysmond
                replace:
                  type: boolean
                  description: Required to replace a live token
      responses:
        '200':
          description: The credential, shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  site: { type: string }
                  token: { type: string }
                  kind: { type: string }
                  config:
                    type: string
                    description: sysmon.conf block (sysmond credentials only)
                  greeting:
                    type: string
                    description: ALERTER greeting line (alerter credentials only)
                  dial:
                    type: string
                    description: host:port the peer dials (alerter credentials only)
                  note: { type: string }
        '409':
          description: Site already has a live token and replace was not set

  /api/settings/agents/revoke/{site}:
    post:
      tags: [Admin]
      summary: Revoke an agent credential
      description: Marks the token revoked and closes the credential's live connection, daemon or alerter.
      security:
        - SessionAuth: []
        - CookieAuth: []
      parameters:
        - name: site
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  site: { type: string }
                  revoked: { type: boolean }
                  disconnected:
                    type: boolean
                    description: Whether a live connection was closed now

  /api/admin/session-log:
    get:
      tags: [Admin]
      summary: Get session log
      description: Returns recent sysmon protocol session log entries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
        - name: site
          in: query
          description: Only entries from this sysmond; omit for the whole fleet
          schema:
            type: string
      responses:
        '200':
          description: Session log retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionLogEntry'
                  count:
                    type: integer

  /api/admin/session-errors:
    get:
      tags: [Admin]
      summary: Get session errors
      description: Returns recent session error entries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: site
          in: query
          description: Only entries from this sysmond; omit for the whole fleet
          schema:
            type: string
      responses:
        '200':
          description: Session errors retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionLogEntry'
                  count:
                    type: integer

components:
  securitySchemes:
    SessionAuth:
      type: http
      scheme: bearer
      description: Session token from POST /api/auth/login, as Authorization Bearer
    CookieAuth:
      type: apiKey
      in: cookie
      name: sysmon_session
      description: The same session token, as the browser UI's cookie

  schemas:
    AgentToken:
      type: object
      properties:
        site: { type: string }
        label: { type: string }
        kind:
          type: string
          enum: [sysmond, alerter]
          description: Set at mint; legacy blank-kind records take the kind of their first greeting
        created: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        last_addr: { type: string }
        revoked: { type: boolean }

    Config:
      type: object
      properties:
        global:
          $ref: '#/components/schemas/GlobalSettings'
        spawns:
          type: array
          items:
            $ref: '#/components/schemas/SpawnCommand'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/Host'

    GlobalSettings:
      type: object
      properties:
        clientport:
          type: integer
          example: 1345
        checkinterval:
          type: integer
          example: 60
        numfailures:
          type: integer
          example: 4
        pageinterval:
          type: integer
          example: 60
        sender:
          type: string
          format: email
        from:
          type: string
          format: email
        subject:
          type: string
        authkey:
          type: string

    SpawnCommand:
      type: object
      properties:
        name:
          type: string
          example: pagechris
        command:
          type: string
          example: /usr/local/bin/sms.sh %s %s

    Host:
      type: object
      properties:
        hostname:
          type: string
          example: web-server-01
        ip:
          type: string
          example: 192.168.1.10
        type:
          type: string
          enum: [icmp, tcp, http, https, ssh, smtp, pop3, imap, dns, snmp]
        port:
          type: integer
        contact:
          type: string
          format: email
        spawn:
          type: string
        paused:
          type: boolean
        notes:
          type: string

    ConfigSnapshot:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/Config'
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    ConfigUpdate:
      allOf:
        - $ref: '#/components/schemas/Config'
        - type: object
          properties:
            version:
              type: string
            comment:
              type: string

    MonitoringStatus:
      type: object
      properties:
        daemon_version:
          type: string
        uptime:
          type: integer
        total_hosts:
          type: integer
        hosts_up:
          type: integer
        hosts_down:
          type: integer
        hosts_critical:
          type: integer
        last_check:
          type: string
          format: date-time

    HostStatus:
      type: object
      properties:
        hostname:
          type: string
        ip:
          type: string
        type:
          type: string
        overall_status:
          type: string
          enum: [OK, WARNING, CRITICAL, UNKNOWN]
        status_message:
          type: string
        last_check:
          type: string
          format: date-time
        uptime_percent:
          type: number
        response_time_ms:
          type: number
        packet_loss_percent:
          type: number

    SNMPTrap:
      type: object
      properties:
        source_ip:
          type: string
        timestamp:
          type: string
          format: date-time
        oid:
          type: string
        value:
          type: string
        severity:
          type: string

    Statistics:
      type: object
      properties:
        total_checks:
          type: integer
        checks_per_second:
          type: number
        average_response_time:
          type: number

    Backup:
      type: object
      properties:
        filename:
          type: string
        timestamp:
          type: string
          format: date-time
        size_bytes:
          type: integer
        comment:
          type: string

    BulkOperationResponse:
      type: object
      properties:
        status:
          type: string
          example: completed
        total:
          type: integer
        success_count:
          type: integer
        failure_count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkOperationResult'

    BulkOperationResult:
      type: object
      properties:
        hostname:
          type: string
        success:
          type: boolean
        error:
          type: string

    SessionLogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        site:
          type: string
          description: Which sysmond the exchange was with
        command:
          type: string
        response:
          type: string
        is_error:
          type: boolean
        error_msg:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - authentication required or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: >
        Authenticated, but this operation is admin-only. Config contents
        and every mutation of shared state sit behind this boundary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Conflict - version mismatch or concurrent modification
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Request limit per time window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when limit resets
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        text/plain:
          schema:
            type: string

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceUnavailable:
      description: Service unavailable - cannot connect to sysmon daemon
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
