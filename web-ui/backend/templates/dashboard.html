{{template "base" .}}

{{define "title"}}Dashboard{{end}}

{{define "content"}}
<div x-data="dashboard()" x-init="init()">
    <!-- Daemon Status Bar -->
    <div x-show="daemon && daemon.version" class="bg-gray-800 text-white rounded-lg px-4 py-2 mb-4 flex flex-wrap items-center justify-between text-sm">
        <div class="flex items-center gap-4">
            <span><i class="fas fa-heartbeat mr-1 text-green-400"></i>sysmon <span class="font-mono" x-text="daemon.version"></span></span>
            <span class="text-gray-400">PID <span x-text="daemon.pid"></span></span>
            <span class="text-gray-400">Up <span x-text="formatUptime(daemon.uptime_seconds)"></span></span>
        </div>
        <div class="flex items-center gap-3">
            <span x-show="daemon.paused" class="px-2 py-0.5 bg-yellow-500 text-black rounded text-xs font-bold"><i class="fas fa-pause mr-1"></i>PAUSED</span>
            <span class="text-gray-500 text-xs" x-text="'Polled ' + new Date().toLocaleTimeString()"></span>
        </div>
    </div>

    <!-- Error State -->
    <div x-show="error" class="bg-red-50 border border-red-200 rounded-lg p-6 mb-6">
        <div class="flex items-start gap-3">
            <i class="fas fa-exclamation-circle text-red-500 text-xl mt-0.5"></i>
            <div>
                <p class="text-red-800 font-medium" x-text="typeof error === 'string' ? error : error?.message"></p>
                <button @click="fetchData()" class="mt-3 px-4 py-2 bg-red-600 text-white text-sm rounded hover:bg-red-700">
                    <i class="fas fa-sync-alt mr-1"></i>Retry
                </button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="text-center py-12 mb-6">
        <i class="fas fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
        <p class="text-gray-500">Connecting to sysmon daemon...</p>
    </div>

    <!-- Status Overview Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8" x-show="!loading && !error">
        <!-- Total Hosts -->
        <div class="bg-white rounded-lg shadow p-4">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-gray-600">Total Hosts</p>
                    <p class="text-2xl font-bold text-gray-900" x-text="stats.total_hosts">-</p>
                </div>
                <i class="fas fa-server text-3xl text-blue-500"></i>
            </div>
        </div>

        <!-- Healthy Hosts -->
        <div class="bg-white rounded-lg shadow p-4">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-gray-600">Healthy</p>
                    <p class="text-2xl font-bold text-green-600" x-text="stats.healthy_hosts">-</p>
                </div>
                <i class="fas fa-check-circle text-3xl text-green-500"></i>
            </div>
        </div>

        <!-- Warning Hosts -->
        <div class="bg-white rounded-lg shadow p-4">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-gray-600">Warnings</p>
                    <p class="text-2xl font-bold text-yellow-600" x-text="stats.warning_hosts">-</p>
                </div>
                <i class="fas fa-exclamation-triangle text-3xl text-yellow-500"></i>
            </div>
        </div>

        <!-- Critical Hosts -->
        <div class="bg-white rounded-lg shadow p-4">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-gray-600">Critical</p>
                    <p class="text-2xl font-bold text-red-600" x-text="stats.critical_hosts">-</p>
                </div>
                <i class="fas fa-times-circle text-3xl text-red-500"></i>
            </div>
        </div>
    </div>

    <!-- Active Alerts -->
    <div class="-mx-4 sm:-mx-6 lg:-mx-8 bg-white shadow mb-8" x-show="alerts.length > 0">
        <div class="px-4 sm:px-6 lg:px-8 py-3 border-b border-gray-200">
            <h2 class="text-base font-semibold text-gray-900">
                <i class="fas fa-bell mr-2 text-red-500"></i>Active Alerts (<span x-text="alerts.length"></span>)
            </h2>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-3 p-3 px-4 sm:px-6 lg:px-8">
            <template x-for="alert in alerts" :key="alert.object_name || alert.hostname">
                <a :href="'/host-detail.html?hostname=' + encodeURIComponent(alert.object_name || alert.hostname)"
                   class="block border border-gray-200 rounded-lg px-3 py-2 hover:bg-gray-50 hover:border-gray-300 transition-all text-sm no-underline">
                    <div class="flex flex-col gap-2">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex items-start gap-2 flex-1 min-w-0">
                                <span :class="{
                                    'bg-yellow-100 text-yellow-800': alert.overall_status === 'WARNING',
                                    'bg-red-100 text-red-800': alert.overall_status === 'CRITICAL'
                                }" class="px-1.5 py-0.5 rounded text-[10px] font-medium flex-shrink-0" x-text="alert.overall_status"></span>
                                <div class="flex flex-col min-w-0 flex-1">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="font-medium text-gray-900 truncate" x-text="alert.description || alert.hostname" :title="alert.description || alert.hostname"></span>
                                        <span class="text-xs text-gray-500 truncate" x-text="alert.description ? ('(' + alert.hostname + ')') : (alert.ipv4_address && alert.ipv4_address !== alert.hostname ? '(' + alert.ipv4_address + ')' : '')"></span>
                                    </div>
                                    <div class="text-[10px] text-red-500 font-medium" x-show="alert.checks && alert.checks[0] && alert.checks[0].status_message" x-text="alert.checks[0].status_message"></div>
                                    <div class="flex items-center gap-3 text-[10px] text-gray-400">
                                        <span x-show="alert.time_failed > 0"><i class="fas fa-clock mr-1"></i>down <span x-text="formatUptime(alert.time_failed)"></span></span>
                                        <span x-show="alert.last_change_time" x-text="formatRelativeTime(alert.last_change_time)"></span>
                                    </div>
                                    <!-- Inline check badges -->
                                    <div class="flex gap-1 flex-wrap mt-1">
                                        <template x-for="check in alert.checks" :key="alert.hostname + '-' + check.type + '-' + (check.port || '0')">
                                            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px]"
                                                  :class="{
                                                      'bg-green-50 text-green-700': check.status === 'OK',
                                                      'bg-yellow-50 text-yellow-700': check.status === 'WARNING',
                                                      'bg-red-50 text-red-700': check.status === 'CRITICAL'
                                                  }">
                                                <i :class="{
                                                    'fas fa-check': check.status === 'OK',
                                                    'fas fa-exclamation-triangle': check.status === 'WARNING',
                                                    'fas fa-times': check.status === 'CRITICAL'
                                                }" class="text-[8px]"></i>
                                                <span x-text="check.type + (check.port ? ':' + check.port : '')"></span>
                                            </span>
                                        </template>
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col gap-1 flex-shrink-0" @click.prevent.stop>
                                <button @click="ackHost(alert.hostname)"
                                        class="px-2 py-1 bg-blue-600 text-white text-[10px] rounded hover:bg-blue-700"
                                        title="Acknowledge">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button @click="showUpdateDialog(alert.hostname)"
                                        class="px-2 py-1 bg-green-600 text-white text-[10px] rounded hover:bg-green-700"
                                        title="Update">
                                    <i class="fas fa-edit"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </a>
            </template>
        </div>
    </div>

    <!-- Recent SNMP Traps -->
    <div class="bg-white rounded-lg shadow" x-show="traps.length > 0">
        <div class="px-6 py-4 border-b border-gray-200">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold text-gray-900">
                    <i class="fas fa-exchange-alt mr-2"></i>Recent SNMP Traps
                </h2>
                <a href="/traps.html" class="text-sm text-blue-600 hover:text-blue-800">View All →</a>
            </div>
        </div>
        <div class="divide-y divide-gray-200">
            <template x-for="(trap, idx) in traps.slice(0, 5)" :key="idx + '-' + trap.timestamp">
                <div class="px-6 py-4 hover:bg-gray-50">
                    <div class="flex items-center justify-between">
                        <div>
                            <span class="font-medium text-gray-900" x-text="trap.source_ip"></span>
                            <span class="text-sm text-gray-500" x-show="trap.source_hostname" x-text="' (' + trap.source_hostname + ')'"></span>
                        </div>
                        <span class="text-xs text-gray-500" x-text="formatRelativeTime(trap.timestamp)"></span>
                    </div>
                    <div class="mt-1" x-show="trap.decoded">
                        <span :class="{
                            'bg-blue-100 text-blue-800': trap.decoded?.severity === 'informational',
                            'bg-yellow-100 text-yellow-800': trap.decoded?.severity === 'warning',
                            'bg-red-100 text-red-800': trap.decoded?.severity === 'error' || trap.decoded?.severity === 'critical'
                        }" class="px-2 py-1 rounded text-xs font-medium mr-2" x-text="trap.decoded?.trap_name"></span>
                        <span class="text-sm text-gray-700" x-text="trap.decoded?.description"></span>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Update Dialog Modal -->
    <div x-show="updateDialog.show"
         @click.away="updateDialog.show = false"
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
         style="display: none;">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">
                <i class="fas fa-edit mr-2 text-green-600"></i>Update Host Status
            </h3>
            <p class="text-sm text-gray-600 mb-4">
                Add a status note for <span class="font-medium" x-text="updateDialog.hostname"></span>
            </p>
            <textarea
                x-model="updateDialog.note"
                class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-green-500 focus:border-transparent"
                rows="3"
                placeholder="Enter status note (e.g., 'Investigating network issue', 'Scheduled maintenance')"></textarea>
            <div class="mt-4 flex justify-end space-x-2">
                <button @click="updateDialog.show = false"
                        class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
                    Cancel
                </button>
                <button @click="updateHost()"
                        class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"
                        :disabled="!updateDialog.note.trim()">
                    <i class="fas fa-save mr-1"></i>Update
                </button>
            </div>
        </div>
    </div>

    <!-- Success Notification -->
    <div x-show="notification.show"
         x-transition
         class="fixed top-4 right-4 bg-green-50 border border-green-200 rounded-lg shadow-lg p-4 z-50"
         style="display: none;">
        <div class="flex items-center">
            <i class="fas fa-check-circle text-green-600 text-xl mr-3"></i>
            <p class="text-green-800" x-text="notification.message"></p>
        </div>
    </div>
</div>

<script>
function dashboard() {
    return {
        loading: true,
        error: null,
        daemon: {},
        stats: {},
        alerts: [],
        traps: [],
        refreshInterval: null,
        updateDialog: {
            show: false,
            hostname: '',
            note: ''
        },
        notification: {
            show: false,
            message: ''
        },

        init() {
            this.fetchData();
            // Auto-refresh every 10 seconds (but not if there's an error showing)
            this.refreshInterval = setInterval(() => {
                if (!this.error) {
                    this.fetchData();
                }
            }, 10000);
        },

        destroy() {
            if (this.refreshInterval) {
                clearInterval(this.refreshInterval);
                this.refreshInterval = null;
            }
        },

        async fetchData() {
            try {
                if (this.stats.total_hosts === undefined) this.loading = true;
                this.error = null;

                const response = await fetch('/api/monitoring/status');
                if (!response.ok) {
                    const errorData = await response.json();
                    // If error has debug details (XML parse error), store them
                    if (errorData.details) {
                        this.error = {
                            message: errorData.message || 'Failed to fetch status',
                            details: errorData.details
                        };
                    } else {
                        this.error = errorData.message || 'Failed to fetch status';
                    }
                    this.loading = false;
                    return;
                }

                const data = await response.json();
                this.daemon = data.daemon;
                this.stats = data.statistics;

                // Get alerts
                const alertsResponse = await fetch('/api/monitoring/alerts');
                if (alertsResponse.ok) {
                    this.alerts = await alertsResponse.json();
                } else {
                    console.warn('Failed to fetch alerts');
                    this.alerts = [];
                }

                // Get traps
                if (data.snmp_traps) {
                    this.traps = data.snmp_traps.recent_traps || [];
                }

                this.loading = false;
            } catch (e) {
                this.error = e?.message || e?.toString() || 'Unknown error';
                this.loading = false;
            }
        },

        async ackHost(hostname) {
            try {
                const result = await apiCall(`/api/monitoring/ack/${hostname}`, {
                    method: 'POST'
                });

                this.showNotification(`Host ${hostname} acknowledged successfully`);

                // Refresh data to show updated status
                setTimeout(() => this.fetchData(), 1000);
            } catch (e) {
                alert(`Failed to acknowledge host: ${e.message}`);
            }
        },

        showUpdateDialog(hostname) {
            this.updateDialog.hostname = hostname;
            this.updateDialog.note = '';
            this.updateDialog.show = true;
        },

        async updateHost() {
            if (!this.updateDialog.note.trim()) {
                return;
            }

            try {
                const result = await apiCall(`/api/monitoring/update/${this.updateDialog.hostname}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        note: this.updateDialog.note
                    })
                });

                this.updateDialog.show = false;
                this.showNotification(`Host ${this.updateDialog.hostname} updated successfully`);

                // Refresh data to show updated status
                setTimeout(() => this.fetchData(), 1000);
            } catch (e) {
                alert(`Failed to update host: ${e.message}`);
            }
        },

        showNotification(message) {
            this.notification.message = message;
            this.notification.show = true;

            // Auto-hide after 3 seconds
            setTimeout(() => {
                this.notification.show = false;
            }, 3000);
        },

        copyXMLToClipboard() {
            const xmlContent = typeof this.error === 'object' && this.error?.details?.raw_xml;
            if (xmlContent) {
                navigator.clipboard.writeText(xmlContent).then(() => {
                    this.showNotification('XML copied to clipboard!');
                }).catch(err => {
                    alert('Failed to copy XML: ' + err.message);
                });
            }
        },

        copyResponseToClipboard(responseText, command) {
            if (responseText) {
                navigator.clipboard.writeText(responseText).then(() => {
                    this.showNotification(`Response '${command}' copied to clipboard!`);
                }).catch(err => {
                    alert('Failed to copy response: ' + err.message);
                });
            }
        }
    };
}
</script>
{{end}}
