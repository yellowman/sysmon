{{template "base" .}}

{{define "title"}}Hosts{{end}}

{{define "content"}}
<div x-data="hostsPage()" x-init="init()">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-900">
            <i class="fas fa-server mr-2"></i>Monitored Hosts
        </h1>
        <div class="flex space-x-4 items-center">
            <input type="text" x-model="searchQuery" placeholder="Search hosts..."
                class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <select x-model="filterStatus" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="">All Status</option>
                <option value="OK">OK</option>
                <option value="WARNING">WARNING</option>
                <option value="CRITICAL">CRITICAL</option>
            </select>
            <!-- View Toggle -->
            <div class="flex border border-gray-300 rounded-lg overflow-hidden">
                <button @click="viewMode = 'comparison'"
                        :class="viewMode === 'comparison' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'"
                        class="px-4 py-2 text-sm font-medium transition-colors">
                    <i class="fas fa-th mr-1"></i>Comparison
                </button>
                <button @click="viewMode = 'table'"
                        :class="viewMode === 'table' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'"
                        class="px-4 py-2 text-sm font-medium border-l border-gray-300 transition-colors">
                    <i class="fas fa-table mr-1"></i>Table
                </button>
            </div>
        </div>
    </div>

    <!-- Comparison View -->
    <div x-show="viewMode === 'comparison'" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-2">
        <template x-for="host in filteredHosts" :key="host.hostname">
            <div class="relative group">
                <div class="bg-white rounded shadow hover:shadow-md transition-all cursor-pointer border-2"
                     :class="{
                         'border-green-500': host.overall_status === 'OK',
                         'border-yellow-500': host.overall_status === 'WARNING',
                         'border-red-500': host.overall_status === 'CRITICAL',
                         'border-gray-400': host.paused
                     }"
                     @click="selectHost(host)">
                    <!-- Compact Header -->
                    <div class="px-2 py-1.5">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="text-xs font-bold text-gray-900 truncate" x-text="host.hostname" :title="host.hostname"></h3>
                            <i x-show="host.paused" class="fas fa-pause text-xs text-gray-400 flex-shrink-0"></i>
                        </div>
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-gray-500 truncate text-[10px]" x-text="host.description || host.ipv4_address || 'N/A'"></span>
                            <span class="text-xs font-medium"
                                  :class="{
                                      'text-green-600': host.overall_status === 'OK',
                                      'text-yellow-600': host.overall_status === 'WARNING',
                                      'text-red-600': host.overall_status === 'CRITICAL'
                                  }"
                                  x-text="getCheckSummary(host)"></span>
                        </div>
                    </div>
                </div>

                <!-- Hover Tooltip -->
                <div class="absolute z-50 hidden group-hover:block bg-gray-900 text-white text-xs rounded-lg shadow-xl p-3 -top-2 left-full ml-2 w-64">
                    <div class="font-bold mb-2" x-text="host.hostname"></div>
                    <div class="space-y-1 text-xs">
                        <div x-show="host.description"><span class="text-gray-400">Description:</span> <span x-text="host.description"></span></div>
                        <div><span class="text-gray-400">IP:</span> <span x-text="host.ipv4_address || 'N/A'"></span></div>
                        <div><span class="text-gray-400">Status:</span>
                            <span :class="{
                                'text-green-400': host.overall_status === 'OK',
                                'text-yellow-400': host.overall_status === 'WARNING',
                                'text-red-400': host.overall_status === 'CRITICAL'
                            }" x-text="host.overall_status"></span>
                        </div>
                        <div><span class="text-gray-400">Contact:</span> <span x-text="host.contact || 'None'"></span></div>
                        <div class="border-t border-gray-700 mt-2 pt-2">
                            <div class="font-semibold mb-1">Checks:</div>
                            <template x-for="check in host.checks.slice(0, 5)" :key="check.type + check.port">
                                <div class="flex items-center justify-between">
                                    <span x-text="check.type + (check.port ? ':' + check.port : '')"></span>
                                    <span :class="{
                                        'text-green-400': check.status === 'OK',
                                        'text-yellow-400': check.status === 'WARNING',
                                        'text-red-400': check.status === 'CRITICAL'
                                    }" x-text="check.status"></span>
                                </div>
                            </template>
                            <div x-show="host.checks.length > 5" class="text-gray-400 mt-1">
                                +<span x-text="host.checks.length - 5"></span> more
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Stats Footer -->
                <div class="px-6 py-3 bg-gray-50 border-t border-gray-200 text-xs text-gray-600">
                    <div class="flex justify-between items-center">
                        <div class="flex space-x-4">
                            <span x-show="host.total_checked > 0" :title="'Up: ' + host.up_count + ', Down: ' + host.down_count">
                                <i class="fas fa-chart-line mr-1"></i>
                                <span x-text="host.total_checked + ' checks'"></span>
                                <span x-show="host.total_down > 0" class="text-red-600">
                                    (<span x-text="((host.total_down / host.total_checked) * 100).toFixed(1)"></span>% down)
                                </span>
                            </span>
                        </div>
                        <span x-show="host.last_change_time" class="text-gray-500" :title="'Last status change: ' + formatTime(host.last_change_time)">
                            <i class="fas fa-clock mr-1"></i>
                            <span x-text="formatTimeAgo(host.last_change_time)"></span>
                        </span>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Table View -->
    <div x-show="viewMode === 'table'" class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
                        @click="sortBy('hostname')">
                        Hostname <i class="fas fa-sort text-xs ml-1"></i>
                    </th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        IP Address
                    </th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
                        @click="sortBy('status')">
                        Status <i class="fas fa-sort text-xs ml-1"></i>
                    </th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        Checks
                    </th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        Contact
                    </th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                        Last Check
                    </th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <template x-for="host in sortedHosts" :key="host.hostname">
                    <tr class="hover:bg-gray-50 cursor-pointer" @click="selectHost(host)">
                        <td class="px-4 py-2 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="w-2 h-2 rounded-full mr-2"
                                     :class="{
                                         'bg-green-500': host.overall_status === 'OK',
                                         'bg-yellow-500': host.overall_status === 'WARNING',
                                         'bg-red-500': host.overall_status === 'CRITICAL',
                                         'bg-gray-400': host.paused
                                     }"></div>
                                <span class="text-sm font-medium text-gray-900" x-text="host.hostname"></span>
                                <i x-show="host.paused" class="fas fa-pause text-xs text-gray-400 ml-2"></i>
                            </div>
                        </td>
                        <td class="px-4 py-2 text-sm text-gray-500">
                            <template x-if="host.description">
                                <div class="font-medium" x-text="host.description"></div>
                            </template>
                            <template x-if="host.ipv4_address">
                                <div class="text-xs text-gray-400" x-text="host.ipv4_address"></div>
                            </template>
                            <template x-if="!host.description && !host.ipv4_address">
                                <span>-</span>
                            </template>
                        </td>
                        <td class="px-4 py-2 whitespace-nowrap">
                            <span class="px-2 py-1 text-xs font-medium rounded"
                                  :class="{
                                      'bg-green-100 text-green-800': host.overall_status === 'OK',
                                      'bg-yellow-100 text-yellow-800': host.overall_status === 'WARNING',
                                      'bg-red-100 text-red-800': host.overall_status === 'CRITICAL'
                                  }"
                                  x-text="host.overall_status"></span>
                        </td>
                        <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-900">
                            <span x-text="getCheckStats(host)"></span>
                        </td>
                        <td class="px-4 py-2 whitespace-nowrap text-sm text-gray-500" x-text="host.contact || '-'"></td>
                        <td class="px-4 py-2 whitespace-nowrap text-xs text-gray-500">
                            <span x-text="getLastCheckTime(host)"></span>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Empty State -->
    <div x-show="filteredHosts.length === 0 && !loading && !error" class="text-center py-12">
        <i class="fas fa-server text-6xl text-gray-300 mb-4"></i>
        <p class="text-gray-500">No hosts found</p>
    </div>

    <!-- Error State -->
    <div x-show="error" class="bg-red-50 border border-red-200 rounded-lg p-6">
        <div class="flex items-start">
            <i class="fas fa-exclamation-circle text-red-500 text-2xl mr-3"></i>
            <div class="flex-1">
                <h3 class="text-lg font-semibold text-red-900 mb-2">Failed to Load Hosts</h3>
                <p class="text-red-700" x-text="error"></p>
                <p class="text-sm text-red-600 mt-2">
                    <i class="fas fa-info-circle mr-1"></i>
                    Make sure the sysmon daemon is running and accessible.
                </p>
                <button @click="fetchHosts()" class="mt-3 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                    <i class="fas fa-sync-alt mr-2"></i>Retry
                </button>
            </div>
            <button @click="error = null" class="text-red-400 hover:text-red-600">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Loading State -->
    <div x-show="loading" class="text-center py-12">
        <i class="fas fa-spinner fa-spin text-4xl text-blue-500"></i>
        <p class="mt-4 text-gray-600">Loading hosts...</p>
    </div>

    <!-- Host Detail Modal -->
    <div x-show="selectedHost" x-cloak @click.away="selectedHost = null"
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div @click.stop class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
            <template x-if="selectedHost">
                <div>
                    <!-- Modal Header -->
                    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center sticky top-0 bg-white">
                        <div class="flex-1">
                            <h2 class="text-2xl font-bold text-gray-900" x-text="selectedHost.hostname"></h2>
                            <div class="mt-1 flex items-center space-x-4 text-sm">
                                <span :class="{
                                    'text-green-600': selectedHost.overall_status === 'OK',
                                    'text-yellow-600': selectedHost.overall_status === 'WARNING',
                                    'text-red-600': selectedHost.overall_status === 'CRITICAL'
                                }" class="font-medium" x-text="selectedHost.overall_status"></span>
                                <span x-show="selectedHost.ipv4_address" class="text-gray-600">
                                    <i class="fas fa-network-wired mr-1"></i>
                                    <span x-text="selectedHost.ipv4_address"></span>
                                </span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <!-- TRACE Toggle -->
                            <button @click="toggleTrace(selectedHost.hostname)"
                                    :class="selectedHost.tracing ? 'bg-blue-600 hover:bg-blue-700' : 'bg-gray-400 hover:bg-gray-500'"
                                    class="px-3 py-1 text-white text-xs rounded transition-colors"
                                    :title="selectedHost.tracing ? 'Tracing enabled - click to disable' : 'Tracing disabled - click to enable'">
                                <i class="fas fa-bug mr-1"></i>
                                <span x-text="selectedHost.tracing ? 'Tracing ON' : 'Trace OFF'"></span>
                            </button>
                            <button @click="selectedHost = null" class="text-gray-400 hover:text-gray-600">
                                <i class="fas fa-times text-2xl"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Modal Content -->
                    <div class="px-6 py-4">
                        <!-- Host Statistics -->
                        <div class="mb-6 grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="bg-gray-50 rounded-lg p-3">
                                <div class="text-xs text-gray-500 uppercase">Total Checks</div>
                                <div class="text-2xl font-bold text-gray-900" x-text="selectedHost.total_checked || 0"></div>
                            </div>
                            <div class="bg-green-50 rounded-lg p-3">
                                <div class="text-xs text-green-600 uppercase">Up Count</div>
                                <div class="text-2xl font-bold text-green-600" x-text="selectedHost.up_count || 0"></div>
                            </div>
                            <div class="bg-red-50 rounded-lg p-3">
                                <div class="text-xs text-red-600 uppercase">Down Count</div>
                                <div class="text-2xl font-bold text-red-600" x-text="selectedHost.down_count || 0"></div>
                            </div>
                            <div class="bg-blue-50 rounded-lg p-3">
                                <div class="text-xs text-blue-600 uppercase">Uptime</div>
                                <div class="text-2xl font-bold text-blue-600">
                                    <span x-show="selectedHost.total_checked > 0"
                                          x-text="(((selectedHost.total_checked - selectedHost.total_down) / selectedHost.total_checked) * 100).toFixed(1) + '%'"></span>
                                    <span x-show="!selectedHost.total_checked || selectedHost.total_checked === 0">N/A</span>
                                </div>
                            </div>
                        </div>

                        <div x-show="selectedHost.last_change_time" class="mb-4 text-sm text-gray-600">
                            <i class="fas fa-clock mr-1"></i>
                            Last status change: <span x-text="formatTime(selectedHost.last_change_time)"></span>
                            (<span x-text="formatTimeAgo(selectedHost.last_change_time)"></span>)
                        </div>

                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Check Results</h3>
                        <div class="space-y-3">
                            <template x-for="check in selectedHost.checks" :key="check.type + (check.port || '')">
                                <div class="border border-gray-200 rounded-lg p-4">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center space-x-3">
                                            <i :class="{
                                                'fas fa-check-circle text-green-500': check.status === 'OK',
                                                'fas fa-exclamation-triangle text-yellow-500': check.status === 'WARNING',
                                                'fas fa-times-circle text-red-500': check.status === 'CRITICAL'
                                            }" class="text-xl"></i>
                                            <div>
                                                <div class="font-medium text-gray-900">
                                                    <span x-text="check.type"></span>
                                                    <span x-show="check.port" x-text="':' + check.port"></span>
                                                </div>
                                                <div class="text-sm text-gray-500" x-show="check.status_message" x-text="check.status_message"></div>
                                            </div>
                                        </div>
                                        <div class="text-right text-sm">
                                            <div class="text-gray-900" x-show="check.response_time_ms">
                                                <span x-text="check.response_time_ms.toFixed(2)"></span>ms
                                            </div>
                                            <div class="text-gray-500" x-text="formatTime(check.last_check_time)"></div>
                                        </div>
                                    </div>
                                    <!-- Additional check result data -->
                                    <div x-show="check.result && Object.keys(check.result).length > 0" class="mt-3 pt-3 border-t border-gray-100">
                                        <dl class="grid grid-cols-2 gap-2 text-sm">
                                            <template x-for="(value, key) in check.result" :key="key">
                                                <div>
                                                    <dt class="text-gray-600" x-text="key"></dt>
                                                    <dd class="text-gray-900 font-medium" x-text="JSON.stringify(value)"></dd>
                                                </div>
                                            </template>
                                        </dl>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function hostsPage() {
    return {
        loading: true,
        error: null,
        hosts: [],
        searchQuery: '',
        filterStatus: '',
        selectedHost: null,
        viewMode: 'comparison', // 'comparison' or 'table'
        sortField: 'hostname',
        sortDirection: 'asc',

        get filteredHosts() {
            return this.hosts.filter(host => {
                const matchesSearch = !this.searchQuery ||
                    host.hostname.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                    (host.description && host.description.toLowerCase().includes(this.searchQuery.toLowerCase())) ||
                    (host.ipv4_address && host.ipv4_address.includes(this.searchQuery));

                const matchesStatus = !this.filterStatus || host.overall_status === this.filterStatus;

                return matchesSearch && matchesStatus;
            });
        },

        get sortedHosts() {
            const sorted = [...this.filteredHosts];
            sorted.sort((a, b) => {
                let aVal, bVal;

                if (this.sortField === 'hostname') {
                    aVal = a.hostname.toLowerCase();
                    bVal = b.hostname.toLowerCase();
                } else if (this.sortField === 'status') {
                    const statusOrder = { 'CRITICAL': 0, 'WARNING': 1, 'OK': 2 };
                    aVal = statusOrder[a.overall_status] || 3;
                    bVal = statusOrder[b.overall_status] || 3;
                } else {
                    aVal = a[this.sortField];
                    bVal = b[this.sortField];
                }

                if (aVal < bVal) return this.sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return this.sortDirection === 'asc' ? 1 : -1;
                return 0;
            });
            return sorted;
        },

        init() {
            this.fetchHosts();
            setInterval(() => this.fetchHosts(), 10000);
        },

        async fetchHosts() {
            try {
                this.loading = true;
                this.error = null;

                const response = await fetch('/api/monitoring/hosts');
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ message: 'Failed to fetch hosts' }));
                    this.error = errorData.message || `Server returned ${response.status}`;
                    this.hosts = [];
                    this.loading = false;
                    return;
                }

                this.hosts = await response.json();
                this.loading = false;
            } catch (e) {
                console.error('Failed to fetch hosts:', e);
                this.error = e.message || 'Failed to connect to server';
                this.hosts = [];
                this.loading = false;
            }
        },

        selectHost(host) {
            this.selectedHost = host;
            // Initialize tracing flag if not present
            if (this.selectedHost.tracing === undefined) {
                this.selectedHost.tracing = false;
            }
        },

        async toggleTrace(hostname) {
            try {
                const result = await apiCall(`/api/monitoring/trace/${hostname}`, {
                    method: 'POST'
                });

                // Update the tracing flag based on response
                if (this.selectedHost && this.selectedHost.hostname === hostname) {
                    this.selectedHost.tracing = result.tracing_enabled;
                }

                // Also update in the hosts list
                const hostInList = this.hosts.find(h => h.hostname === hostname);
                if (hostInList) {
                    hostInList.tracing = result.tracing_enabled;
                }

                // Show notification
                const message = result.tracing_enabled ?
                    `Tracing enabled for ${hostname}` :
                    `Tracing disabled for ${hostname}`;

                alert(message);
            } catch (e) {
                alert(`Failed to toggle trace: ${e.message}`);
            }
        },

        formatTime(timestamp) {
            return new Date(timestamp).toLocaleString();
        },

        formatTimeAgo(timestamp) {
            if (!timestamp) return '';
            const now = new Date();
            const then = new Date(timestamp);
            const diffMs = now - then;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            return then.toLocaleDateString();
        },

        sortBy(field) {
            if (this.sortField === field) {
                this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                this.sortField = field;
                this.sortDirection = 'asc';
            }
        },

        getCheckSummary(host) {
            const ok = host.checks.filter(c => c.status === 'OK').length;
            const total = host.checks.length;
            return `${ok}/${total}`;
        },

        getCheckStats(host) {
            const ok = host.checks.filter(c => c.status === 'OK').length;
            const warning = host.checks.filter(c => c.status === 'WARNING').length;
            const critical = host.checks.filter(c => c.status === 'CRITICAL').length;
            return `${ok} OK, ${warning} WARN, ${critical} CRIT`;
        },

        getLastCheckTime(host) {
            if (!host.checks || host.checks.length === 0) return 'Never';
            const times = host.checks.map(c => new Date(c.last_check_time));
            const latest = new Date(Math.max(...times));

            // Handle invalid/epoch dates (year < 1980 is likely invalid)
            if (latest.getFullYear() < 1980) return 'Never';

            const now = new Date();
            const diff = Math.floor((now - latest) / 1000);

            if (diff < 0) return 'just now'; // Future date, clock skew
            if (diff < 60) return `${diff}s ago`;
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return `${Math.floor(diff / 86400)}d ago`;
        }
    };
}
</script>
{{end}}
