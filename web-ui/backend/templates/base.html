{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysmon - {{block "title" .}}Monitoring{{end}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                },
            }
        }
    }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 antialiased">
    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200" x-data="{mobileOpen: false}">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <span class="text-lg font-extrabold tracking-tight text-gray-900">sys<span class="text-blue-600">mon</span></span>
                    </div>
                    <div class="hidden sm:ml-16 sm:flex sm:space-x-8 items-center">
                        <a href="/" class="nav-link {{if eq .Active "dashboard"}}active{{end}}">
                            <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                        </a>
                        <a href="/hosts.html" class="nav-link {{if eq .Active "hosts"}}active{{end}}">
                            <i class="fas fa-server mr-2"></i>Hosts
                        </a>
                        <a href="/traps.html" class="nav-link {{if eq .Active "traps"}}active{{end}}">
                            <i class="fas fa-exclamation-triangle mr-2"></i>SNMP Traps
                        </a>
                        <a href="/config.html" class="nav-link {{if eq .Active "config"}}active{{end}}">
                            <i class="fas fa-cog mr-2"></i>Configuration
                        </a>
                        <a href="/admin.html" class="nav-link {{if eq .Active "admin"}}active{{end}}">
                            <i class="fas fa-tools mr-2"></i>Admin
                        </a>
                        <a href="/metrics.html" class="nav-link {{if eq .Active "metrics"}}active{{end}}">
                            <i class="fas fa-chart-line mr-2"></i>Metrics
                        </a>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span class="hidden sm:inline text-xs text-gray-400" x-data="{user: sessionStorage.getItem('sysmon_user') || ''}" x-text="user"></span>
                    <button onclick="fetch('/api/auth/logout',{method:'POST'}).then(()=>{sessionStorage.clear();window.location.href='/login.html'})"
                            class="text-xs text-gray-400 hover:text-gray-700">Logout</button>
                    <div class="sm:hidden">
                        <button @click="mobileOpen = !mobileOpen" class="text-gray-500 hover:text-gray-700 p-2">
                            <i :class="mobileOpen ? 'fa-times' : 'fa-bars'" class="fas text-xl"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Mobile menu -->
        <div x-show="mobileOpen" x-cloak class="sm:hidden border-t border-gray-200 bg-white">
            <div class="px-4 py-3 space-y-2">
                <a href="/" class="mobile-nav {{if eq .Active "dashboard"}}active{{end}}"><i class="fas fa-tachometer-alt mr-2 w-5 text-center"></i>Dashboard</a>
                <a href="/hosts.html" class="mobile-nav {{if eq .Active "hosts"}}active{{end}}"><i class="fas fa-server mr-2 w-5 text-center"></i>Hosts</a>
                <a href="/traps.html" class="mobile-nav {{if eq .Active "traps"}}active{{end}}"><i class="fas fa-exclamation-triangle mr-2 w-5 text-center"></i>SNMP Traps</a>
                <a href="/config.html" class="mobile-nav {{if eq .Active "config"}}active{{end}}"><i class="fas fa-cog mr-2 w-5 text-center"></i>Configuration</a>
                <a href="/admin.html" class="mobile-nav {{if eq .Active "admin"}}active{{end}}"><i class="fas fa-tools mr-2 w-5 text-center"></i>Admin</a>
                <a href="/metrics.html" class="mobile-nav {{if eq .Active "metrics"}}active{{end}}"><i class="fas fa-chart-line mr-2 w-5 text-center"></i>Metrics</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {{block "content" .}}{{end}}
    </main>

    <!-- Protocol Error Notification (Fixed Position Right Side) -->
    <div id="protocol-error-indicator" x-data="protocolErrors()" x-show="errors.length > 0" x-cloak
         @click.outside="showDetails = false"
         class="fixed top-20 right-4 z-50">
        <div @click="showDetails = !showDetails"
             class="bg-red-500 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-lg cursor-pointer hover:bg-red-600 transition-colors">
            <i class="fas fa-exclamation-triangle text-xl"></i>
        </div>

        <!-- Error Details Popup -->
        <div x-show="showDetails" x-transition
             class="absolute right-0 top-14 w-96 bg-white rounded-lg shadow-2xl border-2 border-red-500 p-4 max-h-96 overflow-y-auto">
            <h3 class="text-lg font-bold text-red-600 mb-3">
                <i class="fas fa-bug mr-2"></i>Protocol Errors (<span x-text="errors.length"></span>)
            </h3>
            <div class="space-y-2">
                <template x-for="error in errors" :key="error.id || (error.timestamp + '-' + error.command)">
                    <div class="border-l-4 border-red-500 pl-3 py-2 bg-red-50">
                        <div class="flex justify-between items-start">
                            <div class="text-xs text-gray-500" x-text="error.timestamp"></div>
                            <span x-show="error.responseCode"
                                  :class="{
                                      'bg-red-600': error.responseCode >= 400,
                                      'bg-yellow-600': error.responseCode >= 300 && error.responseCode < 400,
                                      'bg-blue-600': error.responseCode < 300
                                  }"
                                  class="px-2 py-0.5 rounded text-white text-xs font-mono"
                                  x-text="error.responseCode"></span>
                        </div>
                        <div class="text-sm font-medium text-gray-900 flex items-center gap-2">
                            <span x-text="error.command"></span>
                            <span x-show="error.count > 1"
                                  class="px-1.5 py-0.5 rounded bg-gray-200 text-gray-700 text-xs font-mono"
                                  x-text="'×' + error.count"></span>
                        </div>
                        <div class="text-sm text-red-700 mt-1" x-text="error.error"></div>
                        <div x-show="error.sysmonResponse" class="mt-2 text-xs font-mono bg-gray-800 text-green-400 p-2 rounded">
                            <div class="text-gray-400 mb-1">Sysmon Response:</div>
                            <div x-text="error.sysmonResponse"></div>
                        </div>
                    </div>
                </template>
            </div>
            <button @click="clearErrors()"
                    class="mt-3 w-full px-3 py-2 bg-red-600 text-white text-sm rounded hover:bg-red-700">
                <i class="fas fa-trash mr-1"></i>Clear All
            </button>
        </div>
    </div>

    <!-- Global JavaScript -->
    <script>
        // Global Protocol Error Tracker
        function protocolErrors() {
            return {
                errors: [],
                showDetails: false,

                init() {
                    // Listen for protocol errors from any page
                    window.addEventListener('protocol-error', (e) => {
                        this.addError(e.detail);
                    });

                    // Load errors from sessionStorage with error handling
                    try {
                        const stored = sessionStorage.getItem('protocol_errors');
                        if (stored) {
                            const parsed = JSON.parse(stored);
                            // Ensure it's an array
                            if (Array.isArray(parsed)) {
                                // Add unique IDs to old errors that don't have them
                                this.errors = parsed.map(err => {
                                    if (!err.id) {
                                        err.id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                                    }
                                    return err;
                                });
                            } else {
                                console.warn('Invalid protocol_errors in sessionStorage, resetting');
                                sessionStorage.removeItem('protocol_errors');
                            }
                        }
                    } catch (e) {
                        console.error('Failed to load protocol errors from sessionStorage:', e);
                        sessionStorage.removeItem('protocol_errors');
                    }
                },

                addError(error) {
                    const command = error.command || 'Unknown';
                    const message = error.error || error.message || 'Unknown error';
                    const responseCode = error.responseCode || error.status;

                    // Collapse repeats: if the last error matches command +
                    // message + status, just bump its count and refresh the
                    // timestamp instead of pushing a duplicate row.
                    const last = this.errors[0];
                    if (last && last.command === command && last.error === message && last.responseCode === responseCode) {
                        last.count = (last.count || 1) + 1;
                        last.timestamp = new Date().toLocaleString();
                        sessionStorage.setItem('protocol_errors', JSON.stringify(this.errors));
                        return;
                    }

                    this.errors.unshift({
                        id: Date.now() + '-' + Math.random().toString(36).substr(2, 9),
                        timestamp: new Date().toLocaleString(),
                        command,
                        error: message,
                        responseCode,
                        sysmonResponse: error.sysmonResponse,
                        count: 1
                    });

                    // Keep only last 50 errors
                    if (this.errors.length > 50) {
                        this.errors = this.errors.slice(0, 50);
                    }

                    // Persist to sessionStorage
                    sessionStorage.setItem('protocol_errors', JSON.stringify(this.errors));
                },

                clearErrors() {
                    this.errors = [];
                    sessionStorage.removeItem('protocol_errors');
                    this.showDetails = false;
                }
            };
        }

        // Shared live-status poller (delta protocol).
        //
        // First call fetches the full /api/monitoring/status; every
        // subsequent poll asks only for what changed via ?since=<rev>, so a
        // steady system transfers a near-empty delta instead of the whole
        // host list. Pages consume the per-poll result and patch only the
        // changed rows into their Alpine arrays - combined with stable row
        // keys this is what keeps big host lists from re-rendering the
        // entire DOM every refresh.
        function createStatusPoller() {
            return {
                rev: 0,
                index: new Map(),
                hostKey(h) { return h.object_name || h.hostname; },

                // Returns {full, hosts, changed, removed, daemon, stats}.
                // `hosts` is always the complete current list; `changed` /
                // `removed` describe just this poll's difference (empty on
                // a full resync - use `full` to decide how to apply).
                async poll() {
                    const url = this.rev === 0
                        ? '/api/monitoring/status'
                        : `/api/monitoring/status?since=${this.rev}`;
                    const d = await apiCall(url);
                    let full, changed = [], removed = [];
                    if (this.rev === 0 || d.full || d.hosts !== undefined) {
                        full = true;
                        const list = d.hosts !== undefined ? (d.hosts || []) : (d.changed || []);
                        this.index = new Map(list.map(h => [this.hostKey(h), h]));
                    } else {
                        full = false;
                        changed = d.changed || [];
                        removed = d.removed || [];
                        for (const h of changed) this.index.set(this.hostKey(h), h);
                        for (const name of removed) this.index.delete(name);
                    }
                    this.rev = d.rev || 0;
                    return {
                        full,
                        hosts: [...this.index.values()],
                        changed,
                        removed,
                        daemon: d.daemon,
                        stats: d.statistics,
                        snmp_traps: d.snmp_traps,   // only present on full fetches
                    };
                },

                // Force the next poll to do a full resync (e.g. after a bulk
                // ack, so acked flags refresh even if rev didn't move).
                invalidate() { this.rev = 0; },
            };
        }

        // Shared time formatting functions
        function formatTime(ts) {
            if (!ts) return '-';
            try { return new Date(ts).toLocaleString(); } catch (e) { return ts; }
        }

        function formatRelativeTime(ts) {
            if (!ts) return '';
            try {
                const seconds = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
                if (seconds < 0) return 'just now';
                if (seconds < 60) return seconds + 's ago';
                if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
                if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
                return Math.floor(seconds / 86400) + 'd ago';
            } catch (e) { return ''; }
        }

        function formatUptime(seconds) {
            if (seconds === undefined || seconds === null) return '-';
            if (seconds === 0) return '0s';
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
            if (h > 0) return h + 'h ' + m + 'm ' + s + 's';
            if (m > 0) return m + 'm ' + s + 's';
            return s + 's';
        }

        function formatTimestamp(unixSeconds) {
            if (!unixSeconds || unixSeconds === 0) return 'Never';
            return new Date(unixSeconds * 1000).toLocaleString();
        }

        // Global helper to log protocol errors
        function logProtocolError(command, error, responseCode, sysmonResponse) {
            window.dispatchEvent(new CustomEvent('protocol-error', {
                detail: {
                    command,
                    error,
                    responseCode,
                    sysmonResponse
                }
            }));
        }

        // Global helper to make authenticated API calls
        async function apiCall(url, options = {}) {
            const token = sessionStorage.getItem('sysmon_token');
            options.headers = options.headers || {};
            if (token) {
                options.headers['Authorization'] = 'Bearer ' + token;
            }

            const response = await fetch(url, options);
            const responseCode = response.status;

            if (responseCode === 401) {
                window.location.href = '/login.html';
                throw new Error('Session expired');
            }

            if (!response.ok) {
                const error = await response.json().catch(() => ({ message: response.statusText }));
                const errorMsg = error.message || 'Request failed';
                // 429s are rate-limit pushback from the global limiter,
                // not protocol errors - don't spam the error panel with
                // them, just throw so the caller can show a retry.
                if (responseCode !== 429) {
                    logProtocolError(url, errorMsg, responseCode);
                }
                throw new Error(errorMsg);
            }

            return await response.json();
        }
    </script>

    <style>
        .nav-link {
            display: inline-flex;
            align-items: center;
            padding: 0 0.25rem;
            border-bottom: 2px solid transparent;
            font-size: 0.8125rem;
            font-weight: 500;
            color: #9ca3af;
            letter-spacing: 0.01em;
            transition: color 0.15s, border-color 0.15s;
        }
        .nav-link:hover { color: #111827; border-bottom-color: #e5e7eb; }
        .nav-link.active { border-bottom-color: #111827; color: #111827; font-weight: 600; }
        .mobile-nav {
            display: block;
            padding: 0.625rem 0.875rem;
            border-radius: 0.5rem;
            font-size: 0.8125rem;
            font-weight: 500;
            color: #6b7280;
            letter-spacing: 0.01em;
        }
        .mobile-nav:hover { background-color: #f9fafb; color: #111827; }
        .mobile-nav.active { background-color: #f0f0f0; color: #111827; font-weight: 600; }
        [x-cloak] { display: none !important; }
        .stat-label { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #9ca3af; }
        .stat-value { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.025em; line-height: 1; }
        .section-title { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; }
        .card { background: white; border: 1px solid #f0f0f0; border-radius: 0.75rem; }
        .card-header { padding: 1rem 1.25rem; border-bottom: 1px solid #f5f5f5; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</body>
</html>
{{end}}
