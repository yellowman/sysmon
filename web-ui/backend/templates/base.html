{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysmon - {{block "title" .}}Monitoring{{end}}</title>
    <!-- Everything below ships in the binary and is served from
         /static/ - no CDN, so the UI works on a network with no route
         to the internet, which is where monitoring consoles live. -->
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/fontawesome/css/all.min.css">
    <script defer src="/static/alpine.min.js"></script>
    <script src="/static/chart.umd.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <!-- Before first paint, so a rail the operator collapsed never renders
         at full width and then snaps. Per browser; a private window or
         blocked storage just gets the full rail. -->
    <script>
        try {
            if (localStorage.getItem('sysmon-rail') === 'collapsed') {
                document.documentElement.classList.add('rail-collapsed');
            }
        } catch (e) {}
    </script>
</head>
<body class="bg-gray-50 antialiased">
    <!-- Application shell.

         The rail answers one question - which part of sysmon am I in -
         and nothing else: it is navigation, not a toolbar. It replaced a
         top bar that had outgrown the job; ten destinations, a fleet
         selector, the user and Logout in one row overflowed a ~1300px
         window, and an overflowing flex row silently pushes whatever is
         rightmost - Logout - off the screen.

         The navigation is rendered once. At lg and up CSS pins it as a
         rail; below that the same element becomes a drawer behind the
         menu button, so phones get this navigation rather than a second
         one to keep in step. Which of the two you get is decided in CSS,
         not by Alpine, so a phone never flashes an open drawer while the
         scripts load.

         Kept in its own scope, as a sibling of <main> rather than a
         parent: pages nest their own components, and would otherwise
         silently inherit this one's site/sites/setSite.

         See web-ui/DESIGN.md for the grammar this follows. -->
    <div x-data="shellState()" x-init="loadSites()"
         @keydown.escape.window="onEscape()">

        <!-- Below lg: a slim bar holding the way into the drawer. -->
        <header class="lg:hidden h-14 flex items-center gap-3 px-4 bg-white border-b border-gray-200">
            <button @click="railOpen = true" class="p-2 -ml-2 text-gray-500 hover:text-gray-900"
                    aria-label="Open navigation" aria-controls="app-rail" :aria-expanded="railOpen">
                <i class="fas fa-bars text-lg" aria-hidden="true"></i>
            </button>
            <a href="/" class="rail-wordmark">sys<span>mon</span></a>
        </header>

        <div x-show="railOpen" x-cloak x-transition.opacity @click="railOpen = false"
             class="lg:hidden fixed inset-0 z-40 bg-gray-900/30"></div>

        <aside id="app-rail" class="rail" :class="{ 'open': railOpen }">
            <div class="rail-top flex items-center justify-between px-4 pt-4 pb-3">
                <a href="/" class="rail-wordmark" aria-label="sysmon dashboard">
                    <span class="rail-mark-full">sys<span>mon</span></span><span class="rail-mark-short" aria-hidden="true">s<span>m</span></span>
                </a>
                <button @click="railOpen = false" class="lg:hidden p-1 text-gray-400 hover:text-gray-700"
                        aria-label="Close navigation">
                    <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
            </div>

            <!-- Global scope: which sysmond the whole console is looking
                 at. It belongs to the shell, not to any one page. Shown
                 only with more than one box - a single-box install has
                 nothing to choose between. -->
            <div x-show="multiSite() || siteGone" x-cloak class="px-2 pb-3">
                <!-- Collapsed, the same control in a compact form: a button
                     that opens an anchored panel of exactly the choices the
                     select offers. Scope never disappears with the labels -
                     the button is blue while a single site is selected and
                     amber if that site has left the fleet, so an operator
                     filtered to one box can still see that they are.
                     A disclosure, not an ARIA menu: the popup is a group of
                     ordinary buttons, reached with Tab, so the trigger says
                     only what it controls and whether it is open. -->
                <div class="rail-site-short relative" @click.outside="siteMenuOpen = false">
                    <button type="button" class="rail-link w-full" @click="toggleSiteMenu()" x-ref="siteButton"
                            :class="{ 'rail-scoped': site !== '' && !siteGone, 'rail-gone': !!siteGone }"
                            aria-controls="rail-site-menu" :aria-expanded="siteMenuOpen.toString()"
                            :title="siteMenuOpen ? null : (siteGone ? ('Site ' + siteGone + ' is no longer in the fleet') : ('Site: ' + currentSiteLabel()))"
                            :aria-label="siteGone ? ('Site ' + siteGone + ' is no longer in the fleet, choose another') : ('Site: ' + currentSiteLabel() + ', change')">
                        <i class="fas" :class="siteGone ? 'fa-triangle-exclamation' : 'fa-location-dot'" aria-hidden="true"></i>
                    </button>
                    <div id="rail-site-menu" x-show="siteMenuOpen" x-cloak class="rail-popover"
                         role="group" aria-label="Which monitoring instance to show">
                        <div class="rail-popover-title">Site</div>
                        <p x-show="siteGone" class="mx-2 mb-1 text-[11px] leading-snug text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1"
                           x-text="'site ' + siteGone + ' is no longer in the fleet'"></p>
                        <button type="button" class="rail-popover-item" :aria-pressed="(site === '').toString()" @click="setSite('')">
                            <i class="fas fa-check" :class="site === '' ? '' : 'invisible'" aria-hidden="true"></i>All sites
                        </button>
                        <template x-for="s in sites" :key="s.site">
                            <button type="button" class="rail-popover-item" :aria-pressed="(site === s.site).toString()" @click="setSite(s.site)">
                                <i class="fas fa-check" :class="site === s.site ? '' : 'invisible'" aria-hidden="true"></i><span
                                    x-text="(s.description || s.site) + (s.reachable ? '' : ' - unreachable')"></span>
                            </button>
                        </template>
                    </div>
                </div>
                <div class="rail-site-full">
                <template x-if="multiSite()">
                    <select class="w-full text-xs border border-gray-200 rounded px-2 py-1.5 bg-white"
                            :value="site"
                            @change="setSite($event.target.value)"
                            aria-label="Which monitoring instance to show"
                            title="Which monitoring instance to show">
                        <option value="">All sites</option>
                        <template x-for="s in sites" :key="s.site">
                            <option :value="s.site"
                                    x-text="(s.description || s.site) + (s.reachable ? '' : ' - unreachable')"></option>
                        </template>
                    </select>
                </template>
                <template x-if="siteGone">
                    <p class="mt-2 text-[11px] leading-snug text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1"
                       x-text="'site ' + siteGone + ' is no longer in the fleet'"></p>
                </template>
                </div>
            </div>

            <!-- Destinations, grouped by whitespace rather than rules:
                 watching the network, then managing what watches it. -->
            <nav class="flex-1 overflow-y-auto px-2 pb-3" aria-label="Application">
                <div class="rail-group">
            <a href="/" class="rail-link {{if eq .Active "dashboard"}}active{{end}}" :title="railCollapsed ? 'Dashboard' : null"
               {{if eq .Active "dashboard"}}aria-current="page"{{end}}><i class="fas fa-tachometer-alt" aria-hidden="true"></i><span class="rail-label">Dashboard</span></a>
            <a href="/hosts.html" class="rail-link {{if eq .Active "hosts"}}active{{end}}" :title="railCollapsed ? 'Hosts' : null"
               {{if eq .Active "hosts"}}aria-current="page"{{end}}><i class="fas fa-server" aria-hidden="true"></i><span class="rail-label">Hosts</span></a>
            <a href="/map.html" class="rail-link {{if eq .Active "map"}}active{{end}}" :title="railCollapsed ? 'Map' : null"
               {{if eq .Active "map"}}aria-current="page"{{end}}><i class="fas fa-sitemap" aria-hidden="true"></i><span class="rail-label">Map</span></a>
            <a href="/traps.html" class="rail-link {{if eq .Active "traps"}}active{{end}}" :title="railCollapsed ? 'SNMP Traps' : null"
               {{if eq .Active "traps"}}aria-current="page"{{end}}><i class="fas fa-exclamation-triangle" aria-hidden="true"></i><span class="rail-label">SNMP Traps</span></a>
            <a href="/history.html" class="rail-link {{if eq .Active "history"}}active{{end}}" :title="railCollapsed ? 'History' : null"
               {{if eq .Active "history"}}aria-current="page"{{end}}><i class="fas fa-clock-rotate-left" aria-hidden="true"></i><span class="rail-label">History</span></a>
            <a href="/metrics.html" class="rail-link {{if eq .Active "metrics"}}active{{end}}" :title="railCollapsed ? 'Metrics' : null"
               {{if eq .Active "metrics"}}aria-current="page"{{end}}><i class="fas fa-chart-line" aria-hidden="true"></i><span class="rail-label">Metrics</span></a>
                </div>
                <div class="rail-group">
            <a href="/fleet.html" class="rail-link {{if eq .Active "fleet"}}active{{end}}" :title="railCollapsed ? 'Fleet' : null"
               {{if eq .Active "fleet"}}aria-current="page"{{end}}><i class="fas fa-network-wired" aria-hidden="true"></i><span class="rail-label">Fleet</span></a>
            <a href="/templates.html" class="rail-link {{if eq .Active "templates"}}active{{end}}" :title="railCollapsed ? 'Templates' : null"
               {{if eq .Active "templates"}}aria-current="page"{{end}}><i class="fas fa-cubes" aria-hidden="true"></i><span class="rail-label">Templates</span></a>
                </div>
            </nav>

            <!-- Kept apart from the destinations above: administration,
                 then the account. Admin-only pages are hidden from an
                 ordinary user rather than offered and then refused - the
                 server gates them too (config contents carry the authkey,
                 SNMP communities and RADIUS secrets), so a link here could
                 only ever lead to a redirect. -->
            <div class="px-2 pb-4">
                <div x-show="$store.auth.role === 'admin'" x-cloak class="rail-group">
            <a href="/config.html" class="rail-link {{if eq .Active "config"}}active{{end}}" :title="railCollapsed ? 'Configuration' : null"
               {{if eq .Active "config"}}aria-current="page"{{end}}><i class="fas fa-cog" aria-hidden="true"></i><span class="rail-label">Configuration</span></a>
            <a href="/admin.html" class="rail-link {{if eq .Active "admin"}}active{{end}}" :title="railCollapsed ? 'Admin' : null"
               {{if eq .Active "admin"}}aria-current="page"{{end}}><i class="fas fa-tools" aria-hidden="true"></i><span class="rail-label">Admin</span></a>
                </div>
                <div class="rail-group">
                    <!-- Desktop only: the phone drawer always shows labels. -->
                    <button type="button" class="rail-link rail-toggle w-full" @click="toggleRail()"
                            aria-controls="app-rail" :aria-expanded="(!railCollapsed).toString()"
                            :title="railCollapsed ? 'Expand menu' : null">
                        <i class="fas" :class="railCollapsed ? 'fa-angles-right' : 'fa-angles-left'" aria-hidden="true"></i><span class="rail-label" x-text="railCollapsed ? 'Expand menu' : 'Collapse'">Collapse</span>
                    </button>
                    <div class="rail-link rail-user" :title="railCollapsed ? ('Signed in as ' + ($store.auth.user || '')) : null">
                        <span class="rail-avatar" aria-hidden="true" x-text="($store.auth.user || '?').charAt(0).toUpperCase()"></span><span
                              class="rail-label truncate" x-text="$store.auth.user"></span>
                    </div>
                    <button type="button" onclick="doLogout()" class="rail-link w-full"
                            :title="railCollapsed ? 'Log out' : null">
                        <i class="fas fa-right-from-bracket" aria-hidden="true"></i><span class="rail-label">Log out</span>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Main Content: unchanged, moved to the right of the rail. Pages own
         everything in here; the shell does not reach in. -->
    <div class="shell-content">
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {{block "content" .}}{{end}}
        </main>
    </div>

    <!-- Protocol Error Notification (Fixed Position Right Side) -->
    <div id="protocol-error-indicator" x-data="protocolErrors()" x-show="errors.length > 0" x-cloak
         @click.outside="showDetails = false"
         class="fixed top-16 lg:top-4 right-4 z-50">
        <div @click="showDetails = !showDetails"
             class="bg-red-500 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-lg cursor-pointer hover:bg-red-600 transition-colors">
            <i class="fas fa-exclamation-triangle text-xl"></i>
        </div>

        <!-- Error Details Popup -->
        <div x-show="showDetails" x-transition
             class="absolute right-0 top-14 w-96 bg-white rounded-lg shadow-2xl border-2 border-red-500 p-4 max-h-96 overflow-y-auto">
            <h3 class="text-lg font-bold text-red-600 mb-3">
                <i class="fas fa-bug mr-2"></i>Protocol Errors (<span x-text="errors.length"></span>)
            </h3>
            <div class="space-y-2">
                <template x-for="error in errors" :key="error.id || (error.timestamp + '-' + error.command)">
                    <div class="border-l-4 border-red-500 pl-3 py-2 bg-red-50">
                        <div class="flex justify-between items-start">
                            <div class="text-xs text-gray-500" x-text="error.timestamp"></div>
                            <span x-show="error.responseCode"
                                  :class="{
                                      'bg-red-600': error.responseCode >= 400,
                                      'bg-yellow-600': error.responseCode >= 300 && error.responseCode < 400,
                                      'bg-blue-600': error.responseCode < 300
                                  }"
                                  class="px-2 py-0.5 rounded text-white text-xs font-mono"
                                  x-text="error.responseCode"></span>
                        </div>
                        <div class="text-sm font-medium text-gray-900 flex items-center gap-2">
                            <span x-text="error.command"></span>
                            <span x-show="error.count > 1"
                                  class="px-1.5 py-0.5 rounded bg-gray-200 text-gray-700 text-xs font-mono"
                                  x-text="'×' + error.count"></span>
                        </div>
                        <div class="text-sm text-red-700 mt-1" x-text="error.error"></div>
                        <div x-show="error.sysmonResponse" class="mt-2 text-xs font-mono bg-gray-800 text-green-400 p-2 rounded">
                            <div class="text-gray-400 mb-1">Sysmon Response:</div>
                            <div x-text="error.sysmonResponse"></div>
                        </div>
                    </div>
                </template>
            </div>
            <button @click="clearErrors()"
                    class="mt-3 w-full px-3 py-2 bg-red-600 text-white text-sm rounded hover:bg-red-700">
                <i class="fas fa-trash mr-1"></i>Clear All
            </button>
        </div>
    </div>

    <!-- Global JavaScript -->
    <script>
        // Global Protocol Error Tracker
        function protocolErrors() {
            return {
                errors: [],
                showDetails: false,

                init() {
                    // Listen for protocol errors from any page
                    window.addEventListener('protocol-error', (e) => {
                        this.addError(e.detail);
                    });

                    // Load errors from sessionStorage with error handling
                    try {
                        const stored = sessionStorage.getItem('protocol_errors');
                        if (stored) {
                            const parsed = JSON.parse(stored);
                            // Ensure it's an array
                            if (Array.isArray(parsed)) {
                                // Add unique IDs to old errors that don't have them
                                this.errors = parsed.map(err => {
                                    if (!err.id) {
                                        err.id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                                    }
                                    return err;
                                });
                            } else {
                                console.warn('Invalid protocol_errors in sessionStorage, resetting');
                                sessionStorage.removeItem('protocol_errors');
                            }
                        }
                    } catch (e) {
                        console.error('Failed to load protocol errors from sessionStorage:', e);
                        sessionStorage.removeItem('protocol_errors');
                    }
                },

                addError(error) {
                    const command = error.command || 'Unknown';
                    const message = error.error || error.message || 'Unknown error';
                    const responseCode = error.responseCode || error.status;

                    // Collapse repeats: if the last error matches command +
                    // message + status, just bump its count and refresh the
                    // timestamp instead of pushing a duplicate row.
                    const last = this.errors[0];
                    if (last && last.command === command && last.error === message && last.responseCode === responseCode) {
                        last.count = (last.count || 1) + 1;
                        last.timestamp = new Date().toLocaleString();
                        sessionStorage.setItem('protocol_errors', JSON.stringify(this.errors));
                        return;
                    }

                    this.errors.unshift({
                        id: Date.now() + '-' + Math.random().toString(36).substr(2, 9),
                        timestamp: new Date().toLocaleString(),
                        command,
                        error: message,
                        responseCode,
                        sysmonResponse: error.sysmonResponse,
                        count: 1
                    });

                    // Keep only last 50 errors
                    if (this.errors.length > 50) {
                        this.errors = this.errors.slice(0, 50);
                    }

                    // Persist to sessionStorage
                    sessionStorage.setItem('protocol_errors', JSON.stringify(this.errors));
                },

                clearErrors() {
                    this.errors = [];
                    sessionStorage.removeItem('protocol_errors');
                    this.showDetails = false;
                }
            };
        }


        // The shell's own state: the drawer, the collapse, and the fleet
        // selector it hosts. Methods rather than getters, for the reason
        // fleetState gives - Object.assign copies a getter's value once.
        function shellState() {
            return Object.assign({
                railOpen: false,
                // Seeded from the class the head script set before paint.
                railCollapsed: document.documentElement.classList.contains('rail-collapsed'),
                toggleRail() {
                    this.siteMenuOpen = false;
                    this.railCollapsed = !this.railCollapsed;
                    document.documentElement.classList.toggle('rail-collapsed', this.railCollapsed);
                    try { localStorage.setItem('sysmon-rail', this.railCollapsed ? 'collapsed' : 'full'); } catch (e) {}
                    // The content area just changed width. Pages that size
                    // themselves to it - the map, the charts - re-measure on
                    // resize, so tell them, once the width has settled.
                    setTimeout(() => window.dispatchEvent(new Event('resize')), 200);
                },
                currentSiteLabel() {
                    if (!this.site) return 'All sites';
                    const s = this.sites.find(x => x.site === this.site);
                    return s ? (s.description || s.site) : this.site;
                },
                // The collapsed site control: the same choices as the select,
                // in a panel anchored to the button. Focus goes to the current
                // choice so the keyboard lands where the operator already is.
                siteMenuOpen: false,
                toggleSiteMenu() {
                    this.siteMenuOpen = !this.siteMenuOpen;
                    if (this.siteMenuOpen) {
                        this.$nextTick(() => {
                            const cur = document.querySelector('#rail-site-menu [aria-pressed="true"]');
                            if (cur) cur.focus();
                        });
                    }
                },
                onEscape() {
                    this.railOpen = false;
                    if (!this.siteMenuOpen) return;
                    // Closing hides whatever in the panel had focus; hand it
                    // back to the button that opened it, not to the page.
                    // Focus that has already moved elsewhere stays put.
                    const menu = document.getElementById('rail-site-menu');
                    const hadFocus = menu.contains(document.activeElement) ||
                                     document.activeElement === this.$refs.siteButton;
                    this.siteMenuOpen = false;
                    if (hadFocus) this.$refs.siteButton.focus();
                },
            }, fleetState());
        }

        // The fleet, and which site the operator is looking at. Sticky
        // across pages: somebody working on one box should not have to
        // reselect it on every screen. A single-box install never sees a
        // selector, because there is nothing to select.
        function fleetState() {
            return {
                sites: [],
                site: localStorage.getItem('sysmon-site') || '',
                siteGone: '',
                async loadSites() {
                    try {
                        const r = await apiCall('/api/sites');
                        // A fetch failure keeps the last-known list: a
                        // blanked list would silently remove the site
                        // selector from every page mid-outage.
                        this.sites = r.sites || [];
                        // A filter pointing at a site that has left the
                        // fleet is not silently reset to "all" - a UI that
                        // quietly starts showing everything is worse than
                        // one that says the site it was watching is gone.
                        if (this.site && !this.sites.some(s => s.site === this.site)) {
                            this.siteGone = this.site;
                        }
                    } catch (e) { /* keep the last-known list */ }
                },
                setSite(v) {
                    this.site = v;
                    this.siteGone = '';
                    localStorage.setItem('sysmon-site', v);
                    window.location.reload();
                },
                // A method, not a getter: the nav builds its scope with
                // Object.assign, which copies a getter's value once rather
                // than the getter itself - so a getter here would freeze
                // at false before the fleet ever loaded.
                multiSite() { return this.sites.length > 1; }
            };
        }

        // Naming, shared by every page.
        //
        // The key is fleet-wide ("site:object") and is what every API call
        // and stored row uses. The label is what a person reads: the bare
        // name, with the site shown separately so nobody has to parse it
        // back out of a key. Plain functions rather than methods, because
        // every page needs them and none of them owns the poller.
        function hostKey(h) { return h.object_name || h.hostname; }
        function hostLabel(h) { return h.local_name || h.object_name || h.hostname; }
        function hostSite(h) { return h.site && h.site !== 'local' ? h.site : ''; }

        // In-page dialogs, replacing window.alert/confirm/prompt across
        // the UI. The native ones look like the browser, not this page,
        // and block the event loop; these draw a card styled like the
        // rest of the UI and return promises:
        //   uiAlert(msg)            resolves when dismissed
        //   uiConfirm(msg, opts)    resolves true/false
        //   uiPrompt(msg, initial)  resolves the string, or null on cancel
        // opts: title, okText, cancelText, danger (red confirm button).
        // Calls queue: a dialog opened while one is up waits its turn.
        const uiDialog = (() => {
            let chain = Promise.resolve();

            function show(kind, message, opts) {
                opts = opts || {};
                return new Promise(resolve => {
                    const overlay = document.createElement('div');
                    overlay.className = 'fixed inset-0 z-50 bg-gray-900 bg-opacity-40 flex items-center justify-center p-4';

                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-lg shadow-xl border border-gray-200 w-full max-w-md';
                    overlay.appendChild(card);

                    const title = document.createElement('div');
                    title.className = 'px-5 pt-4 text-base font-semibold text-gray-900';
                    title.textContent = opts.title ||
                        (kind === 'confirm' ? 'Please confirm' : kind === 'prompt' ? 'Input needed' : 'Notice');
                    card.appendChild(title);

                    const body = document.createElement('div');
                    body.className = 'px-5 py-3 text-sm text-gray-700 whitespace-pre-line break-words';
                    body.textContent = message == null ? '' : String(message);
                    card.appendChild(body);

                    let input = null;
                    if (kind === 'prompt') {
                        input = document.createElement('input');
                        input.type = 'text';
                        input.value = opts.value != null ? String(opts.value) : '';
                        input.placeholder = opts.placeholder || '';
                        input.className = 'mx-5 mb-2 block px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500';
                        input.style.width = 'calc(100% - 2.5rem)';
                        card.appendChild(input);
                    }

                    const footer = document.createElement('div');
                    footer.className = 'px-5 py-3 mt-2 bg-gray-50 rounded-b-lg flex justify-end gap-2';
                    card.appendChild(footer);

                    const cancelValue = kind === 'prompt' ? null : kind === 'confirm' ? false : undefined;
                    function close(result) {
                        document.removeEventListener('keydown', onKey, true);
                        overlay.remove();
                        resolve(result);
                    }

                    if (kind !== 'alert') {
                        const cancelBtn = document.createElement('button');
                        cancelBtn.type = 'button';
                        cancelBtn.textContent = opts.cancelText || 'Cancel';
                        cancelBtn.className = 'px-4 py-2 text-sm rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100';
                        cancelBtn.addEventListener('click', () => close(cancelValue));
                        footer.appendChild(cancelBtn);
                    }

                    const okBtn = document.createElement('button');
                    okBtn.type = 'button';
                    okBtn.textContent = opts.okText || 'OK';
                    okBtn.className = 'px-4 py-2 text-sm rounded-lg text-white ' +
                        (opts.danger ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700');
                    okBtn.addEventListener('click', () =>
                        close(kind === 'prompt' ? input.value : kind === 'confirm' ? true : undefined));
                    footer.appendChild(okBtn);

                    // The backdrop is a cancel, like clicking away from a menu.
                    overlay.addEventListener('mousedown', e => {
                        if (e.target === overlay) close(cancelValue);
                    });

                    function onKey(e) {
                        if (e.key === 'Escape') {
                            e.preventDefault(); e.stopPropagation();
                            close(cancelValue);
                        } else if (e.key === 'Enter' && (kind !== 'prompt' || e.target === input)) {
                            e.preventDefault(); e.stopPropagation();
                            okBtn.click();
                        }
                    }
                    document.addEventListener('keydown', onKey, true);

                    document.body.appendChild(overlay);
                    (input || okBtn).focus();
                    if (input) input.select();
                });
            }

            function queued(kind, message, opts) {
                const run = chain.then(() => show(kind, message, opts));
                chain = run.then(() => {}, () => {});
                return run;
            }

            return {
                alert: (m, o) => queued('alert', m, o),
                confirm: (m, o) => queued('confirm', m, o),
                prompt: (m, o) => queued('prompt', m, o),
            };
        })();
        function uiAlert(message, opts) { return uiDialog.alert(message, opts); }
        function uiConfirm(message, opts) { return uiDialog.confirm(message, opts); }
        // Second argument mirrors native prompt(msg, initial); an options
        // object also works.
        function uiPrompt(message, valueOrOpts) {
            const opts = (valueOrOpts !== null && typeof valueOrOpts === 'object')
                ? valueOrOpts : { value: valueOrOpts };
            return uiDialog.prompt(message, opts);
        }

        // The site filter as a query parameter, for pages that fetch.
        function siteQuery(sep) {
            const v = localStorage.getItem('sysmon-site') || '';
            return v ? (sep || '?') + 'site=' + encodeURIComponent(v) : '';
        }

        // Shared live-status poller (delta protocol).
        //
        // First call fetches the full /api/monitoring/status; every
        // subsequent poll asks only for what changed via ?since=<rev>, so a
        // steady system transfers a near-empty delta instead of the whole
        // host list. Pages consume the per-poll result and patch only the
        // changed rows into their Alpine arrays - combined with stable row
        // keys this is what keeps big host lists from re-rendering the
        // entire DOM every refresh.
        function createStatusPoller() {
            return {
                rev: 0,
                index: new Map(),
                // Which site the current index and revision belong to.
                // The poller has to carry the selector's choice or the
                // navbar says "Bend" while the page shows the whole
                // fleet - the single worst thing a monitoring UI can do,
                // because every count and colour on screen then answers
                // a different question than the one the operator asked.
                site: null,

                // Returns {full, hosts, changed, removed, daemon, stats}.
                // `hosts` is always the complete current list; `changed` /
                // `removed` describe just this poll's difference (empty on
                // a full resync - use `full` to decide how to apply).
                async poll() {
                    // A changed selection invalidates the delta cursor:
                    // "what changed since rev N" is only meaningful
                    // within one site's stream, and the index still
                    // holds the old site's hosts.
                    const site = localStorage.getItem('sysmon-site') || '';
                    if (site !== this.site) {
                        this.site = site;
                        this.rev = 0;
                        this.index = new Map();
                    }
                    const q = site ? 'site=' + encodeURIComponent(site) : '';
                    const url = this.rev === 0
                        ? '/api/monitoring/status' + (q ? '?' + q : '')
                        : `/api/monitoring/status?since=${this.rev}` + (q ? '&' + q : '');
                    const d = await apiCall(url);
                    let full, changed = [], removed = [];
                    if (this.rev === 0 || d.full || d.hosts !== undefined) {
                        full = true;
                        const list = d.hosts !== undefined ? (d.hosts || []) : (d.changed || []);
                        this.index = new Map(list.map(h => [hostKey(h), h]));
                    } else {
                        full = false;
                        changed = d.changed || [];
                        removed = d.removed || [];
                        // Removals first, then changes. The server keeps
                        // the two lists disjoint, so the order is not
                        // supposed to matter - but if a name ever appears
                        // in both, the honest reading is that it is here
                        // now: "removed" is a thing that happened, and
                        // "changed" carries the row's current state. The
                        // other order deletes a host that exists, and it
                        // stays gone until its signature next moves.
                        // hosts.html applies them this way round too.
                        for (const name of removed) this.index.delete(name);
                        for (const h of changed) this.index.set(hostKey(h), h);
                    }
                    this.rev = d.rev || 0;
                    return {
                        full,
                        hosts: [...this.index.values()],
                        changed,
                        removed,
                        daemon: d.daemon,
                        stats: d.statistics,
                        snmp_traps: d.snmp_traps,   // only present on full fetches
                        // undefined on servers that predate fleet coverage
                        sitesReachable: d.sites_reachable,
                    };
                },

                // Force the next poll to do a full resync (e.g. after a bulk
                // ack, so acked flags refresh even if rev didn't move).
                invalidate() { this.rev = 0; },
            };
        }

        // Shared time formatting functions
        function formatTime(ts) {
            if (!ts) return '-';
            try { return new Date(ts).toLocaleString(); } catch (e) { return ts; }
        }

        function formatRelativeTime(ts) {
            if (!ts) return '';
            try {
                const seconds = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
                if (seconds < 0) return 'just now';
                if (seconds < 60) return seconds + 's ago';
                if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
                if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
                return Math.floor(seconds / 86400) + 'd ago';
            } catch (e) { return ''; }
        }

        function formatUptime(seconds) {
            if (seconds === undefined || seconds === null) return '-';
            if (seconds === 0) return '0s';
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
            if (h > 0) return h + 'h ' + m + 'm ' + s + 's';
            if (m > 0) return m + 'm ' + s + 's';
            return s + 's';
        }

        function formatTimestamp(unixSeconds) {
            if (!unixSeconds || unixSeconds === 0) return 'Never';
            return new Date(unixSeconds * 1000).toLocaleString();
        }

        // Global helper to log protocol errors
        function logProtocolError(command, error, responseCode, sysmonResponse) {
            window.dispatchEvent(new CustomEvent('protocol-error', {
                detail: {
                    command,
                    error,
                    responseCode,
                    sysmonResponse
                }
            }));
        }

        // Who is logged in, from the server. sessionStorage is per-tab
        // and only written at login, so a session that outlives a UI
        // deploy (or a fresh tab) can be missing the role - and every
        // admin-gated control would silently vanish while the server
        // still says admin. The store seeds from sessionStorage for a
        // paint without flicker, then /api/auth/me corrects both.
        document.addEventListener('alpine:init', () => {
            Alpine.store('auth', {
                user: sessionStorage.getItem('sysmon_user') || '',
                role: sessionStorage.getItem('sysmon_role') || '',
            });
            apiCall('/api/auth/me').then(me => {
                if (me && me.username) {
                    Alpine.store('auth').user = me.username;
                    Alpine.store('auth').role = me.role || '';
                    sessionStorage.setItem('sysmon_user', me.username);
                    sessionStorage.setItem('sysmon_role', me.role || '');
                }
            }).catch(() => {});
        });

        // Logout must actually revoke the server-side session: the cookie
        // is HttpOnly, so only a successful response from the server ends
        // it - clearing sessionStorage alone just makes the UI *look*
        // logged out while every page load re-authenticates off the
        // cookie. So: send the Bearer token too (covers cookie-less
        // sessions), retry once, and on failure say so instead of faking
        // a logout that did not happen.
        async function doLogout() {
            const opts = { method: 'POST', headers: {} };
            const t = sessionStorage.getItem('sysmon_token');
            if (t) opts.headers['Authorization'] = 'Bearer ' + t;
            let ok = false;
            for (let i = 0; i < 2 && !ok; i++) {
                try { ok = (await fetch('/api/auth/logout', opts)).ok; } catch (e) {}
            }
            if (ok) {
                sessionStorage.clear();
                window.location.href = '/login.html';
            } else {
                uiAlert('Logout failed: the server did not confirm the session was ended.');
            }
        }

        // Global helper to make authenticated API calls
        async function apiCall(url, options = {}) {
            const token = sessionStorage.getItem('sysmon_token');
            options.headers = options.headers || {};
            if (token) {
                options.headers['Authorization'] = 'Bearer ' + token;
            }

            const response = await fetch(url, options);
            const responseCode = response.status;

            if (responseCode === 401) {
                window.location.href = '/login.html';
                throw new Error('Session expired');
            }

            if (!response.ok) {
                const error = await response.json().catch(() => ({ message: response.statusText }));
                const errorMsg = error.message || 'Request failed';
                // 429s are rate-limit pushback from the global limiter,
                // not protocol errors - don't spam the error panel with
                // them, just throw so the caller can show a retry.
                if (responseCode !== 429) {
                    logProtocolError(url, errorMsg, responseCode);
                }
                throw new Error(errorMsg);
            }

            return await response.json();
        }
    </script>

    <style>
        /* The application rail. One width, used by the rail and by the
           offset of the content beside it, so the two cannot drift. */
        :root { --rail-w: 12rem; }
        /* Where the working region starts: past the rail on the desktop,
           the viewport edge where the rail is a drawer. The content offset
           reads it, and so does anything a page floats over the content.
           .shell-center-x centres a fixed element on the working region,
           not the viewport, and follows the rail when it collapses. It
           spans the region and centres with auto margins rather than
           left:50% plus translateX(-50%), because a transform does not
           move the layout box: that box shrink-wraps to the space right
           of its left edge, so a wide toolbar wraps in a region it fits.
           A 1rem gutter each side: one too wide for the region wraps
           inside it rather than running into the rail. */
        :root { --shell-inset: 0px; }
        .shell-content { padding-left: var(--shell-inset); }
        .shell-center-x {
            left: calc(var(--shell-inset) + 1rem); right: 1rem;
            width: fit-content; margin-left: auto; margin-right: auto;
        }
        .rail {
            position: fixed; top: 0; bottom: 0; left: 0; z-index: 40;
            width: var(--rail-w);
            display: flex; flex-direction: column;
            background: #fff; border-right: 1px solid #e5e7eb;
            /* Below lg the rail is a drawer, closed until opened. */
            transform: translateX(-100%);
            transition: transform 0.2s ease;
        }
        .rail.open { transform: none; box-shadow: 0 10px 25px rgba(17, 24, 39, 0.15); }
        @media (min-width: 1024px) {
            :root { --shell-inset: var(--rail-w); }
            .rail, .rail.open { transform: none; box-shadow: none; }
        }
        @media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

        .rail-wordmark {
            font-size: 1.125rem; font-weight: 800; letter-spacing: -0.025em;
            color: #111827; text-decoration: none;
        }
        .rail-wordmark span { color: #2563eb; }

        .rail-group + .rail-group { margin-top: 1.25rem; }
        .rail-link {
            position: relative;
            display: flex; align-items: center; gap: 0.625rem;
            padding: 0.4375rem 0.625rem;
            border-radius: 0.375rem;
            font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.01em;
            color: #4b5563; text-decoration: none; text-align: left;
            transition: background-color 0.15s, color 0.15s;
        }
        .rail-link i { width: 1rem; text-align: center; color: #9ca3af; }
        .rail-link:hover { background-color: #f9fafb; color: #111827; }
        .rail-link:hover i { color: #6b7280; }
        .rail-link:focus-visible { outline: 2px solid #2563eb; outline-offset: -2px; }
        /* Where you are carries two signals - a faint accent fill and a
           2px marker - plus weight, so it never rests on colour alone. */
        .rail-link.active { background-color: #eff6ff; color: #111827; font-weight: 600; }
        .rail-link.active i { color: #2563eb; }
        .rail-link.active::before {
            content: ""; position: absolute; left: 0; top: 0.375rem; bottom: 0.375rem;
            width: 2px; border-radius: 1px; background: #2563eb;
        }
        /* In the drawer the same links are touch targets. */
        @media (max-width: 1023px) { .rail-link { padding-top: 0.625rem; padding-bottom: 0.625rem; } }

        /* Compact pieces, only ever shown by the collapsed rail. */
        .rail-mark-short, .rail-site-short, .rail-toggle { display: none; }
        .rail-wordmark .rail-mark-short span { color: #2563eb; }
        /* A single site selected: signal the narrowed scope the way the
           active destination signals place - fill and a blue icon. */
        .rail-link.rail-scoped { background-color: #eff6ff; }
        .rail-link.rail-scoped i { color: #2563eb; }
        .rail-link.rail-gone i { color: #b45309; }

        /* The signed-in user: a row like the others, not a link. */
        .rail-link.rail-user { color: #9ca3af; font-size: 0.75rem; cursor: default; }
        .rail-link.rail-user:hover { background-color: transparent; color: #9ca3af; }
        .rail-avatar {
            flex-shrink: 0; width: 1.25rem; height: 1.25rem; margin: 0 -0.125rem;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 9999px; background: #f3f4f6; color: #4b5563;
            font-size: 0.6875rem; font-weight: 600;
        }

        /* The collapsed site panel, anchored beside its button. The button
           sits inside the rail's 0.5rem gutter and 1px border, so clear
           both and leave a small gap past the rail's outer edge. */
        .rail-popover {
            position: absolute; left: calc(100% + 0.5rem + 1px + 0.25rem); top: 0; z-index: 50;
            min-width: 12rem; max-width: 18rem; max-height: 60vh; overflow-y: auto;
            background: #fff; border: 1px solid #e5e7eb; border-radius: 0.5rem;
            box-shadow: 0 10px 25px rgba(17, 24, 39, 0.12); padding-bottom: 0.25rem;
        }
        .rail-popover-title {
            padding: 0.5rem 0.75rem 0.25rem; font-size: 0.6875rem; font-weight: 600;
            letter-spacing: 0.05em; text-transform: uppercase; color: #9ca3af;
        }
        .rail-popover-item {
            display: flex; align-items: center; gap: 0.5rem; width: 100%;
            padding: 0.375rem 0.75rem; font-size: 0.8125rem; color: #374151; text-align: left;
        }
        .rail-popover-item:hover { background-color: #f9fafb; color: #111827; }
        .rail-popover-item:focus-visible { outline: 2px solid #2563eb; outline-offset: -2px; }
        .rail-popover-item[aria-pressed="true"] { color: #111827; font-weight: 600; }
        .rail-popover-item i { width: 0.875rem; font-size: 0.75rem; color: #2563eb; }

        @media (min-width: 1024px) {
            .rail-toggle { display: flex; }
            .rail, .shell-content { transition: width 0.15s ease, padding-left 0.15s ease; }

            /* Collapsed to icons: the operator's choice, desktop only. One
               variable narrows the rail and the content offset together. */
            html.rail-collapsed { --rail-w: 3rem; }
            html.rail-collapsed .rail-top { justify-content: center; padding-left: 0; padding-right: 0; }
            html.rail-collapsed .rail-mark-full,
            html.rail-collapsed .rail-site-full { display: none; }
            html.rail-collapsed .rail-mark-short { display: inline; }
            html.rail-collapsed .rail-site-short { display: block; }
            html.rail-collapsed .rail-link { justify-content: center; padding-left: 0; padding-right: 0; }
            /* Hidden from sight, not removed: screen readers still name
               every destination, and the link still has its text. */
            html.rail-collapsed .rail-label {
                position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
                overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
            }
        }
        @media (prefers-reduced-motion: reduce) { .rail, .shell-content { transition: none; } }
        [x-cloak] { display: none !important; }
        .stat-label { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #9ca3af; }
        .stat-value { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.025em; line-height: 1; }
        .section-title { font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; }
        .card { background: white; border: 1px solid #f0f0f0; border-radius: 0.75rem; }
        .card-header { padding: 1rem 1.25rem; border-bottom: 1px solid #f5f5f5; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</body>
