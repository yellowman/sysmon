{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysmon - {{block "title" .}}Monitoring{{end}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <i class="fas fa-heartbeat text-2xl text-blue-600"></i>
                        <span class="ml-2 text-xl font-bold text-gray-900">Sysmon</span>
                    </div>
                    <div class="hidden sm:ml-16 sm:flex sm:space-x-8 items-center">
                        <a href="/" class="nav-link {{if eq .Active "dashboard"}}active{{end}}">
                            <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
                        </a>
                        <a href="/hosts.html" class="nav-link {{if eq .Active "hosts"}}active{{end}}">
                            <i class="fas fa-server mr-2"></i>Hosts
                        </a>
                        <a href="/traps.html" class="nav-link {{if eq .Active "traps"}}active{{end}}">
                            <i class="fas fa-exclamation-triangle mr-2"></i>SNMP Traps
                        </a>
                        <a href="/config.html" class="nav-link {{if eq .Active "config"}}active{{end}}">
                            <i class="fas fa-cog mr-2"></i>Configuration
                        </a>
                        <a href="/admin.html" class="nav-link {{if eq .Active "admin"}}active{{end}}">
                            <i class="fas fa-tools mr-2"></i>Admin
                        </a>
                        <a href="/metrics.html" class="nav-link {{if eq .Active "metrics"}}active{{end}}">
                            <i class="fas fa-chart-line mr-2"></i>Metrics
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {{block "content" .}}{{end}}
    </main>

    <!-- Protocol Error Notification (Fixed Position Right Side) -->
    <div id="protocol-error-indicator" x-data="protocolErrors()" x-show="errors.length > 0" x-cloak
         class="fixed top-20 right-4 z-50">
        <div @mouseenter="showDetails = true" @mouseleave="showDetails = false"
             class="bg-red-500 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-lg cursor-pointer hover:bg-red-600 transition-colors">
            <i class="fas fa-exclamation-triangle text-xl"></i>
        </div>

        <!-- Error Details Popup -->
        <div x-show="showDetails" x-transition
             class="absolute right-0 top-14 w-96 bg-white rounded-lg shadow-2xl border-2 border-red-500 p-4 max-h-96 overflow-y-auto">
            <h3 class="text-lg font-bold text-red-600 mb-3">
                <i class="fas fa-bug mr-2"></i>Protocol Errors (<span x-text="errors.length"></span>)
            </h3>
            <div class="space-y-2">
                <template x-for="error in errors" :key="error.id || (error.timestamp + '-' + error.command)">
                    <div class="border-l-4 border-red-500 pl-3 py-2 bg-red-50">
                        <div class="flex justify-between items-start">
                            <div class="text-xs text-gray-500" x-text="error.timestamp"></div>
                            <span x-show="error.responseCode"
                                  :class="{
                                      'bg-red-600': error.responseCode >= 400,
                                      'bg-yellow-600': error.responseCode >= 300 && error.responseCode < 400,
                                      'bg-blue-600': error.responseCode < 300
                                  }"
                                  class="px-2 py-0.5 rounded text-white text-xs font-mono"
                                  x-text="error.responseCode"></span>
                        </div>
                        <div class="text-sm font-medium text-gray-900" x-text="error.command"></div>
                        <div class="text-sm text-red-700 mt-1" x-text="error.error"></div>
                        <div x-show="error.sysmonResponse" class="mt-2 text-xs font-mono bg-gray-800 text-green-400 p-2 rounded">
                            <div class="text-gray-400 mb-1">Sysmon Response:</div>
                            <div x-text="error.sysmonResponse"></div>
                        </div>
                    </div>
                </template>
            </div>
            <button @click="clearErrors()"
                    class="mt-3 w-full px-3 py-2 bg-red-600 text-white text-sm rounded hover:bg-red-700">
                <i class="fas fa-trash mr-1"></i>Clear All
            </button>
        </div>
    </div>

    <!-- Global Auth Modal -->
    <div id="auth-modal" x-data="authModal()" x-show="show" x-cloak
         @auth-required.window="requestAuth($event.detail)"
         class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div @click.away="show = false" class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">
                <i class="fas fa-lock mr-2 text-blue-600"></i>Authentication Required
            </h3>
            <p class="text-sm text-gray-600 mb-4" x-text="message"></p>

            <input type="password" x-model="authKey" @keydown.enter="submit()"
                   class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                   placeholder="Enter authentication key">

            <div class="mt-4 flex justify-end space-x-2">
                <button @click="cancel()"
                        class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">
                    Cancel
                </button>
                <button @click="submit()"
                        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    <i class="fas fa-key mr-1"></i>Authenticate
                </button>
            </div>

            <div class="mt-3 text-xs text-gray-500">
                <i class="fas fa-info-circle mr-1"></i>
                Auth key is stored in browser session only
            </div>
        </div>
    </div>

    <!-- Global JavaScript -->
    <script>
        // Global Protocol Error Tracker
        function protocolErrors() {
            return {
                errors: [],
                showDetails: false,

                init() {
                    // Listen for protocol errors from any page
                    window.addEventListener('protocol-error', (e) => {
                        this.addError(e.detail);
                    });

                    // Load errors from sessionStorage with error handling
                    try {
                        const stored = sessionStorage.getItem('protocol_errors');
                        if (stored) {
                            const parsed = JSON.parse(stored);
                            // Ensure it's an array
                            if (Array.isArray(parsed)) {
                                // Add unique IDs to old errors that don't have them
                                this.errors = parsed.map(err => {
                                    if (!err.id) {
                                        err.id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                                    }
                                    return err;
                                });
                            } else {
                                console.warn('Invalid protocol_errors in sessionStorage, resetting');
                                sessionStorage.removeItem('protocol_errors');
                            }
                        }
                    } catch (e) {
                        console.error('Failed to load protocol errors from sessionStorage:', e);
                        sessionStorage.removeItem('protocol_errors');
                    }
                },

                addError(error) {
                    this.errors.unshift({
                        id: Date.now() + '-' + Math.random().toString(36).substr(2, 9),
                        timestamp: new Date().toLocaleString(),
                        command: error.command || 'Unknown',
                        error: error.error || error.message || 'Unknown error',
                        responseCode: error.responseCode || error.status,
                        sysmonResponse: error.sysmonResponse
                    });

                    // Keep only last 50 errors
                    if (this.errors.length > 50) {
                        this.errors = this.errors.slice(0, 50);
                    }

                    // Persist to sessionStorage
                    sessionStorage.setItem('protocol_errors', JSON.stringify(this.errors));
                },

                clearErrors() {
                    this.errors = [];
                    sessionStorage.removeItem('protocol_errors');
                    this.showDetails = false;
                }
            };
        }

        // Global Auth Modal
        function authModal() {
            return {
                show: false,
                authKey: '',
                message: 'This action requires authentication',
                resolveCallback: null,
                rejectCallback: null,

                init() {
                    // Load saved auth key from sessionStorage
                    const saved = sessionStorage.getItem('sysmon_auth_key');
                    if (saved) {
                        this.authKey = saved;
                    }
                },

                requestAuth(detail) {
                    this.message = detail.message || 'This action requires authentication';
                    this.show = true;

                    return new Promise((resolve, reject) => {
                        this.resolveCallback = resolve;
                        this.rejectCallback = reject;
                    });
                },

                submit() {
                    if (!this.authKey.trim()) {
                        alert('Please enter an authentication key');
                        return;
                    }

                    // Save to sessionStorage
                    sessionStorage.setItem('sysmon_auth_key', this.authKey);

                    if (this.resolveCallback) {
                        this.resolveCallback(this.authKey);
                    }

                    this.show = false;
                },

                cancel() {
                    if (this.rejectCallback) {
                        this.rejectCallback(new Error('Authentication cancelled'));
                    }
                    this.show = false;
                }
            };
        }

        // Global helper to get auth key
        function getAuthKey() {
            return sessionStorage.getItem('sysmon_auth_key') || '';
        }

        // Global helper to log protocol errors
        function logProtocolError(command, error, responseCode, sysmonResponse) {
            window.dispatchEvent(new CustomEvent('protocol-error', {
                detail: {
                    command,
                    error,
                    responseCode,
                    sysmonResponse
                }
            }));
        }

        // Global helper to make authenticated API calls
        async function apiCall(url, options = {}) {
            const authKey = getAuthKey();

            // Add auth header if available
            if (authKey) {
                options.headers = options.headers || {};
                options.headers['X-Auth-Key'] = authKey;
            }

            try {
                const response = await fetch(url, options);
                const responseCode = response.status;

                // Handle 401 - auth required
                if (responseCode === 401) {
                    // Clear invalid key
                    sessionStorage.removeItem('sysmon_auth_key');

                    // Dispatch auth-required event
                    const authEvent = new CustomEvent('auth-required', {
                        detail: {
                            message: 'Authentication required for this action',
                            url: url,
                            options: options
                        }
                    });
                    window.dispatchEvent(authEvent);

                    // Log with response code
                    logProtocolError(url, 'Authentication required', responseCode);
                    throw new Error('Authentication required');
                }

                if (!response.ok) {
                    const error = await response.json().catch(() => ({ message: response.statusText }));
                    const errorMsg = error.message || 'Request failed';

                    // Log with response code
                    logProtocolError(url, errorMsg, responseCode);
                    throw new Error(errorMsg);
                }

                return await response.json();
            } catch (e) {
                // Log protocol error if not already logged
                if (!e.logged) {
                    logProtocolError(url, e.message);
                }
                throw e;
            }
        }
    </script>

    <style>
        .nav-link {
            @apply inline-flex items-center px-1 border-b-2 border-transparent text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300 transition-colors;
        }
        .nav-link.active {
            @apply border-blue-500 text-gray-900;
        }
        [x-cloak] { display: none !important; }
    </style>
</body>
</html>
{{end}}
