# XcodeGen project spec - the .xcodeproj is generated, never committed.
#
#   brew install xcodegen && cd ios && xcodegen generate
#
# CI does exactly this on every push (.github/workflows/ios.yml), so no
# Mac is required on anyone's desk. Open the generated Sysmon.xcodeproj
# in Xcode only if you actually have one and want to.
name: Sysmon
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
targets:
  Sysmon:
    type: application
    platform: iOS
    sources:
      - Sysmon
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sysmon.app
        PRODUCT_NAME: Sysmon
        INFOPLIST_FILE: Sysmon/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sysmon/Sysmon.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
